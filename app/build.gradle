plugins {
    id 'com.android.application'
}

android {
    namespace 'com.projectmister.game'
    compileSdk 36

    defaultConfig {
        applicationId "com.projectmister.game"
        minSdk 26
        targetSdk 36
        versionCode 27
        versionName "2.3.2-dev"
    }

    signingConfigs {
        dev {
            storeFile file("$rootDir/project-mister-dev.keystore")
            storePassword "projectmisterdev"
            keyAlias "projectmister"
            keyPassword "projectmisterdev"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.dev
        }
        release {
            // Deliberately unsigned: the checked-in development key is NOT a production key.
            debuggable false
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
