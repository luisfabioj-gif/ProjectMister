plugins {
    id 'com.android.application'
}

android {
    namespace 'com.projectmister.game'
    compileSdk 36

    defaultConfig {
        applicationId "com.projectmister.game"
        minSdk 26
        targetSdk 36
        versionCode 44
        versionName "2.3.18"
    }

    signingConfigs {
        dev {
            storeFile file("$rootDir/project-mister-dev.keystore")
            storePassword "projectmisterdev"
            keyAlias "projectmister"
            keyPassword "projectmisterdev"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.dev
        }
        release {
            // Deliberately unsigned: the checked-in development key is NOT a production key.
            debuggable false
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Billing brings newer Kotlin stdlib through AndroidX; align legacy JDK variants.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'com.android.billingclient:billing:9.1.0'
}
