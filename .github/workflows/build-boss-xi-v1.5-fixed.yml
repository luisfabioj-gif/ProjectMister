                      int role = playerRoleStatus[p.id];
                      if (role == 2) starters.add(p);
                      else if (role == 1) substitutes.add(p);
                      else reserves.add(p);
                  }
          
                  Collections.sort(starters, (a, b) -> Integer.compare(playerSelectedSlot[a.id], playerSelectedSlot[b.id]));
