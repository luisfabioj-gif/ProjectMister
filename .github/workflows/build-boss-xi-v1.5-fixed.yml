              private class ClassicPortraitView extends View {
                  private final Player player;
                  private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final RectF rect = new RectF();
          
                  ClassicPortraitView(Player p) {
                      super(MainActivity.this);
                      this.player = p;
                  }
          
                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      float w = getWidth();
                      float h = getHeight();
          
                      int border = Color.rgb(214, 187, 96);
                      int cardTop = Color.rgb(92, 98, 72);
                      int cardBottom = Color.rgb(58, 63, 46);
                      int frame = Color.rgb(33, 38, 28);
                      int shirt = primaryColours[player.team];
                      int trim = secondaryColours[player.team];
          
                      paint.setStyle(Paint.Style.FILL);
                      paint.setShader(null);
                      rect.set(0, 0, w, h);
                      paint.setColor(frame);
                      canvas.drawRoundRect(rect, dp(10), dp(10), paint);
          
                      android.graphics.LinearGradient gradient = new android.graphics.LinearGradient(
                              0, 0, 0, h,
                              cardTop,
                              cardBottom,
                              android.graphics.Shader.TileMode.CLAMP
                      );
                      paint.setShader(gradient);
                      rect.set(dp(3), dp(3), w - dp(3), h - dp(3));
                      canvas.drawRoundRect(rect, dp(8), dp(8), paint);
                      paint.setShader(null);
          
                      paint.setColor(Color.argb(36, 255, 255, 255));
                      for (int i = 0; i < 5; i++) {
                          canvas.drawRect(dp(6), dp(10 + i * 20), w - dp(6), dp(18 + i * 20), paint);
                      }
          
                      float headCx = w * 0.50f;
                      float headCy = h * 0.36f;
                      float headRx = w * 0.18f + (player.id % 4) * dp(1);
                      float headRy = h * 0.16f + (player.id % 3) * dp(1);
                      int[] skinTones = {
                              Color.rgb(241, 206, 176), Color.rgb(220, 180, 140),
                              Color.rgb(193, 143, 103), Color.rgb(132, 94, 64)
                      };
                      int skin = skinTones[Math.abs(player.id + player.age) % skinTones.length];
                      int hair = darken(shirt, 60 - (player.id % 25));
                      if (player.id % 5 == 0) hair = Color.rgb(48, 35, 25);
                      if (player.id % 7 == 0) hair = Color.rgb(28, 28, 28);
                      if (player.id % 11 == 0) hair = Color.rgb(167, 120, 58);
          
                      // shoulders / shirt
                      paint.setColor(shirt);
                      rect.set(w * 0.18f, h * 0.66f, w * 0.82f, h * 0.95f);
                      canvas.drawRoundRect(rect, dp(14), dp(14), paint);
                      paint.setColor(trim);
                      canvas.drawRect(w * 0.47f, h * 0.66f, w * 0.53f, h * 0.95f, paint);
                      paint.setColor(lighten(trim, 30));
                      canvas.drawRect(w * 0.20f, h * 0.70f, w * 0.32f, h * 0.74f, paint);
          
                      // neck
                      paint.setColor(skin);
                      rect.set(w * 0.44f, h * 0.54f, w * 0.56f, h * 0.66f);
                      canvas.drawRoundRect(rect, dp(4), dp(4), paint);
          
                      // ears
                      paint.setColor(skin);
                      canvas.drawOval(headCx - headRx - dp(4), headCy - dp(8), headCx - headRx + dp(4), headCy + dp(8), paint);
                      canvas.drawOval(headCx + headRx - dp(4), headCy - dp(8), headCx + headRx + dp(4), headCy + dp(8), paint);
          
                      // face
                      paint.setColor(skin);
                      rect.set(headCx - headRx, headCy - headRy, headCx + headRx, headCy + headRy);
                      canvas.drawOval(rect, paint);
          
                      // hair
                      paint.setColor(hair);
                      int hairStyle = Math.abs(player.id + player.team) % 4;
                      if (hairStyle == 0) {
                          rect.set(headCx - headRx, headCy - headRy, headCx + headRx, headCy - headRy * 0.05f);
                          canvas.drawArc(rect, 180, 180, true, paint);
                      } else if (hairStyle == 1) {
                          rect.set(headCx - headRx * 0.95f, headCy - headRy * 0.96f, headCx + headRx * 0.75f, headCy - headRy * 0.10f);
                          canvas.drawArc(rect, 180, 190, true, paint);
                      } else if (hairStyle == 2) {
                          rect.set(headCx - headRx * 0.55f, headCy - headRy * 1.02f, headCx + headRx * 0.55f, headCy - headRy * 0.62f);
                          canvas.drawRoundRect(rect, dp(6), dp(6), paint);
                      }
          
                      // eyebrows and eyes
                      float eyeY = headCy - headRy * 0.08f;
                      float eyeDx = headRx * 0.45f;
                      paint.setStrokeWidth(dp(2));
                      paint.setColor(darken(hair, 10));
                      canvas.drawLine(headCx - eyeDx - dp(6), eyeY - dp(6), headCx - eyeDx + dp(4), eyeY - dp(7), paint);
                      canvas.drawLine(headCx + eyeDx - dp(4), eyeY - dp(7), headCx + eyeDx + dp(6), eyeY - dp(6), paint);
                      paint.setColor(Color.WHITE);
                      canvas.drawOval(headCx - eyeDx - dp(6), eyeY - dp(2), headCx - eyeDx + dp(4), eyeY + dp(5), paint);
                      canvas.drawOval(headCx + eyeDx - dp(4), eyeY - dp(2), headCx + eyeDx + dp(6), eyeY + dp(5), paint);
                      paint.setColor(Color.rgb(38, 47, 58));
                      canvas.drawCircle(headCx - eyeDx, eyeY + dp(1), dp(2), paint);
                      canvas.drawCircle(headCx + eyeDx, eyeY + dp(1), dp(2), paint);
          
                      // nose
                      paint.setColor(darken(skin, 18));
                      paint.setStrokeWidth(dp(1));
                      canvas.drawLine(headCx, headCy - dp(1), headCx - dp(2), headCy + dp(9), paint);
                      canvas.drawLine(headCx - dp(2), headCy + dp(9), headCx + dp(3), headCy + dp(9), paint);
          
                      // mouth
                      paint.setColor(Color.rgb(131, 63, 64));
                      rect.set(headCx - dp(9), headCy + dp(14), headCx + dp(9), headCy + dp(21));
                      canvas.drawArc(rect, 8, 164, false, paint);
          
                      // label strip
                      paint.setColor(Color.argb(215, 20, 24, 18));
                      rect.set(dp(6), h - dp(32), w - dp(6), h - dp(8));
                      canvas.drawRoundRect(rect, dp(6), dp(6), paint);
                      paint.setColor(border);
                      paint.setTextSize(dp(9));
                      paint.setTypeface(Typeface.DEFAULT_BOLD);
                      canvas.drawText(player.position + "  AGE " + player.age, dp(12), h - dp(15), paint);
                  }
              }
          
              private int playerKnowledge(Player p) {
                  return 4;
              }
          
              private String knownOverallLabel(Player p) {
                  int k = playerKnowledge(p);
                  if (k >= 3) return "OVR " + p.overall;
                  if (k == 2) return "OVR ~" + (Math.round(p.overall / 5f) * 5);
                  if (k == 1) return p.overall >= 82 ? "High reputation" : p.overall >= 72 ? "Established" : "Unproven";
                  return "Unscouted";
              }
          
              private String knownValueLabel(Player p) {
                  int k = playerKnowledge(p);
                  if (k >= 2) return "€" + p.valueMillions + "m";
                  if (k == 1) return p.valueMillions >= 15 ? "High" : p.valueMillions >= 6 ? "Medium" : "Low";
                  return "Unknown";
              }
          
              private int to20(int value) {
                  return Math.max(1, Math.min(20, Math.round(value / 5f)));
              }
          
              private String classicAttributeLine(String name, int internalValue, int knowledge, int revealAt) {
                  return String.format(Locale.UK, "%-13s  %2d", name, to20(internalValue));
              }
          
              private String classicAbilityBand(int ability) {
                  if (ability >= 170) return "Elite";
                  if (ability >= 145) return "Top division";
                  if (ability >= 120) return "Strong professional";
                  if (ability >= 95) return "Developing";
                  return "Raw";
              }
          
              private String traitLabel(int value) {
                  if (value >= 17) return "Excellent";
                  if (value >= 13) return "Good";
                  if (value >= 9) return "Average";
                  if (value >= 5) return "Questionable";
                  return "Poor";
              }
          
              private String inverseTraitLabel(int value) {
                  if (value <= 4) return "Very low";
                  if (value <= 8) return "Low";
                  if (value <= 13) return "Average";
                  if (value <= 17) return "High";
                  return "Very high";
              }
          
              private void showPlayerComparison(Player a, Player b) {
                  String message =
                          String.format(Locale.UK, "%-13s %8s %8s\n", "", shortName(a.name), shortName(b.name))
                                  + String.format(Locale.UK, "%-13s %8d %8d\n", "OVR", a.overall, b.overall)
                                  + String.format(Locale.UK, "%-13s %8d %8d\n", "Pace", to20(a.pace), to20(b.pace))
                                  + String.format(Locale.UK, "%-13s %8d %8d\n", "Technique", to20(a.technique), to20(b.technique))
                                  + String.format(Locale.UK, "%-13s %8d %8d\n", "Passing", to20(a.passing), to20(b.passing))
                                  + String.format(Locale.UK, "%-13s %8d %8d\n", "Finishing", to20(a.finishing), to20(b.finishing))
                                  + String.format(Locale.UK, "%-13s %8d %8d\n", "Defending", to20(a.defending), to20(b.defending))
                                  + String.format(Locale.UK, "%-13s %8d %8d\n", "Physical", to20(a.physical), to20(b.physical))
                                  + String.format(Locale.UK, "%-13s %8s %8s", "Potential", classicAbilityBand(a.potentialAbility), classicAbilityBand(b.potentialAbility));
                  new AlertDialog.Builder(this)
                          .setTitle("Player Comparison")
                          .setMessage(message)
                          .setPositiveButton("Close", null)
                          .show();
              }
          
              private String shortName(String name) {
                  if (name.length() <= 8) return name;
                  return name.substring(0, 8);
              }
          
              private void editManagerNote(Player p) {
                  EditText input = new EditText(this);
                  input.setText(managerNotes[p.id] == null ? "" : managerNotes[p.id]);
                  input.setHint("Example: Scout again in January");
                  new AlertDialog.Builder(this)
                          .setTitle("Manager note — " + p.name)
                          .setView(input)
