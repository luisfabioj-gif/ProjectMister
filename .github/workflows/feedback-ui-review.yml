name: BOSS XI device feedback visual review
on:
  push:
    branches: [work/boss-xi-v2.3]
    paths: ['app/**', '.github/workflows/feedback-ui-review.yml']
permissions:
  contents: read
jobs:
  feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build candidate and preserved baseline
        run: |
          gradle :app:assembleDebug --no-daemon
          bash tools/build-test-sdk.sh
          git worktree add --detach /tmp/boss-baseline 73275b274b02c3273e72d9710f0639a54f29d590
          cd /tmp/boss-baseline
          gradle :app:assembleDebug --no-daemon
      - name: Prepare the bounded feedback scenario
        run: |
          cat > /tmp/qa-feedback.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p qa-feedback-output
          trap 'adb logcat -d > qa-feedback-output/logcat.txt; adb pull /sdcard/Android/data/com.projectmister.game/files/qa qa-feedback-output/ >/dev/null 2>&1 || true' EXIT
          adb install -r /tmp/boss-baseline/app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/test-manual/qa.apk
          timeout 180s adb shell am instrument -w -e mode seed com.projectmister.game.test/com.projectmister.game.qa.SmokeRunner | tee qa-feedback-output/baseline.txt
          grep -q 'PASS baseline career seeded' qa-feedback-output/baseline.txt
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          timeout 600s adb shell am instrument -w -e mode feedback com.projectmister.game.test/com.projectmister.game.qa.SmokeRunner | tee qa-feedback-output/feedback.txt
          grep -q 'PASS all eleven feedback areas, exact identities, timed scouting, ordinal tables and sixty-four stadium upgrades verified' qa-feedback-output/feedback.txt
          adb shell wm size 720x1280
          adb shell wm density 320
          timeout 120s adb shell am instrument -w -e mode compact com.projectmister.game.test/com.projectmister.game.qa.SmokeRunner | tee qa-feedback-output/compact.txt
          grep -q 'PASS compact landscape formations usable' qa-feedback-output/compact.txt
          SH
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash /tmp/qa-feedback.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BOSS-XI-feedback-visual-review
          path: qa-feedback-output/
          retention-days: 14
