                  ArrayList<Fixture> fixtures = buildClubFixtures(tab);
                  if (fixtures.isEmpty()) {
                      TextView none = makeText("No fixtures in this competition.", 16, muted);
                      none.setPadding(0, dp(20), 0, 0);
                      page.addView(none);
                      return;
                  }
          
                  for (Fixture f : fixtures) {
                      LinearLayout row = makePanel();
                      String venue = f.home ? "H" : "A";
                      TextView top = makeText(f.date.format(DATE_FORMAT) + "  •  " + venue + "  •  " + fixtureOpponentName(f), 16, text);
                      top.setTypeface(Typeface.DEFAULT_BOLD);
                      row.addView(top);
          
                      String detail;
                      if (f.played) {
                          detail = f.stage + "\nFT  " + f.goalsFor + " - " + f.goalsAgainst;
                      } else {
                          detail = f.stage + "\nUpcoming";
                      }
                      row.addView(makeText(detail, 14, f.played ? accent : muted));
                      page.addView(row);
                  }
              }
          
