                          .setPositiveButton("Leave", (d, w) -> {
                              stopLiveMatchTicker();
                              setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_PORTRAIT);
                              saveCurrentGame();
                              showDashboard();
                          })
                          .show();
              }
          
          
              private LinearLayout createPage(String title, String subtitle, boolean showHome) {
