              private void setLiveSpeed(int speed) {
                  liveSpeed = speed;
                  refreshLiveHeader();
              }
          
              private void startLiveMatchTicker() {
                  matchRunnable = new Runnable() {
                      @Override
                      public void run() {
                          if (!liveMatchActive) return;
          
                          if (!livePaused) {
                              float oldMinute = liveMinuteFloat;
                              liveMinuteFloat = Math.min(90f, liveMinuteFloat + (0.25f * liveSpeed));
                              int newMinute = (int) liveMinuteFloat;
          
                              while (liveMinute < newMinute && liveMinute < 90) {
                                  liveMinute++;
                                  processLiveMinute(liveMinute);
                              }
          
                              if (livePitchView != null) {
                                  livePitchView.stepSimulation();
                                  livePitchView.invalidate();
                              }
          
                              refreshLiveHeader();
          
                              if (liveMinuteFloat >= 90f) {
                                  finishLiveMatch();
                                  return;
                              }
                          }
          
                          matchHandler.postDelayed(this, 250);
                      }
                  };
                  matchHandler.post(matchRunnable);
              }
          
              private void stopLiveMatchTicker() {
                  liveMatchActive = false;
                  if (matchRunnable != null) matchHandler.removeCallbacks(matchRunnable);
                  matchRunnable = null;
              }
          
              private void processLiveMinute(int minute) {
                  int basePossession = 50 + (strength[liveHome] - strength[liveAway]) / 3;
                  if (liveMentality.equals("Attacking") && selectedClub == liveHome) basePossession += 3;
                  if (liveMentality.equals("Attacking") && selectedClub == liveAway) basePossession -= 3;
                  if (liveMentality.equals("Defensive") && selectedClub == liveHome) basePossession -= 2;
                  if (liveMentality.equals("Defensive") && selectedClub == liveAway) basePossession += 2;
          
                  liveHomePossession = Math.max(35, Math.min(65, basePossession + random.nextInt(7) - 3));
                  liveAwayPossession = 100 - liveHomePossession;
          
                  if (minute == 45) {
                      liveCommentary = "Half-time. The managers have 15 minutes to make adjustments.";
                      return;
                  }
          
                  double eventChance = 0.13;
                  if (minute > 75) eventChance += 0.03;
                  if (random.nextDouble() > eventChance) {
                      if (random.nextDouble() < 0.22) {
                          int team = random.nextInt(100) < liveHomePossession ? liveHome : liveAway;
                          liveCommentary = randomPlayerName(team, false) + " keeps the ball moving.";
                      }
                      return;
                  }
          
                  int attacking = random.nextInt(100) < liveHomePossession ? liveHome : liveAway;
                  int defending = attacking == liveHome ? liveAway : liveHome;
          
                  double strengthEdge = (strength[attacking] - strength[defending]) / 100.0;
                  double mentalityBoost = 0.0;
                  if (attacking == selectedClub && liveMentality.equals("Attacking")) mentalityBoost = 0.05;
                  if (attacking == selectedClub && liveMentality.equals("Defensive")) mentalityBoost = -0.03;
          
                  if (attacking == liveHome) liveHomeShots++; else liveAwayShots++;
          
                  String attacker = randomPlayerName(attacking, true);
                  double onTargetChance = 0.42 + strengthEdge * 0.25 + mentalityBoost;
          
                  if (random.nextDouble() < onTargetChance) {
                      if (attacking == liveHome) liveHomeOnTarget++; else liveAwayOnTarget++;
          
                      double goalChance = 0.20 + strengthEdge * 0.16 + mentalityBoost;
                      if (random.nextDouble() < goalChance) {
                          if (attacking == liveHome) liveHomeGoals++; else liveAwayGoals++;
                          liveCommentary = "GOAL! " + attacker + " finishes the move for " + clubNames[attacking] + "!";
                          awardLiveGoal(attacking, attacker);
                      } else {
                          liveCommentary = attacker + " shoots on target — the goalkeeper makes the save.";
                      }
                  } else {
                      if (random.nextDouble() < 0.22) {
                          if (attacking == liveHome) liveHomeCorners++; else liveAwayCorners++;
                          liveCommentary = attacker + " forces a corner for " + clubNames[attacking] + ".";
                      } else {
                          String[] misses = {
                                  "fires just wide.",
                                  "drives the effort over the bar.",
                                  "sees the shot blocked.",
                                  "tries from distance but misses the target."
                          };
                          liveCommentary = attacker + " " + misses[random.nextInt(misses.length)];
                      }
                  }
              }
          
              private String randomPlayerName(int team, boolean attacking) {
                  ArrayList<Player> choices = new ArrayList<>();
                  for (Player p : players) {
                      if (p.team != team) continue;
                      if (!attacking || p.position.equals("ST") || p.position.equals("RW")
                              || p.position.equals("LW") || p.position.equals("AM")
                              || p.position.equals("CM") || p.position.equals("RM")
                              || p.position.equals("LM")) {
                          choices.add(p);
                      }
                  }
                  if (choices.isEmpty()) {
                      for (Player p : players) if (p.team == team) choices.add(p);
                  }
                  if (choices.isEmpty()) return clubNames[team] + " player";
                  return choices.get(random.nextInt(choices.size())).name;
              }
          
              private void awardLiveGoal(int team, String scorerName) {
                  for (Player p : players) {
                      if (p.team == team && p.name.equals(scorerName)) {
                          p.goals++;
                          p.morale = Math.min(100, p.morale + 3);
                          break;
                      }
                  }
              }
          
