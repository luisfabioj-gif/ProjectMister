name: Build Project Mister APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Project Mister v0.4
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/projectmister/game
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ProjectMister"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.projectmister.game'
              compileSdk 35

              defaultConfig {
                  applicationId "com.projectmister.game"
                  minSdk 26
                  targetSdk 35
                  versionCode 4
                  versionName "0.4"
              }

              signingConfigs {
                  dev {
                      storeFile file("$rootDir/project-mister-dev.keystore")
                      storePassword "projectmisterdev"
                      keyAlias "projectmister"
                      keyPassword "projectmisterdev"
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.dev
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:statusBarColor">#07151F</item>
                  <item name="android:navigationBarColor">#07151F</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/AppTheme"
                  android:label="Project Mister"
                  android:allowBackup="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          echo '' | base64 -d > project-mister-dev.keystore

          cat > app/src/main/java/com/projectmister/game/MainActivity.java <<'EOF'
          package com.projectmister.game;
          
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          
          import java.time.LocalDate;
          import java.time.format.DateTimeFormatter;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.List;
          import java.util.Locale;
          import java.util.Random;
          
          public class MainActivity extends Activity {
          
              private static final int SAVE_SLOTS = 3;
              private static final int PLAYERS_PER_TEAM = 20;
              private static final int TOTAL_PLAYERS = 18 * PLAYERS_PER_TEAM;
              private static final LocalDate SEASON_START = LocalDate.of(2026, 8, 9);
              private static final DateTimeFormatter DATE_FORMAT = DateTimeFormatter.ofPattern("d MMM yyyy", Locale.UK);
          
              private final String[] defaultClubNames = {
                      "Lisboa Águias", "Lisboa Leões", "Porto Dragões", "Braga Guerreiros",
                      "Guimarães Castelo", "Famal Norte", "Moreira FC", "Vila do Conde",
                      "Barcelos FC", "Estoril Praia", "Lisboa Corvos", "Açores FC",
                      "Madeira Nacional", "Alverca Atlético", "Arouca FC", "Amadora Estrela",
                      "Tondela SC", "Vila das Aves"
              };
          
              private final String[] shortNames = {
                      "LAG", "LLE", "PDR", "BGR", "GCT", "FAM", "MOR", "VDC", "BAR",
                      "EST", "LCO", "ACO", "MDN", "ALV", "ARO", "AMA", "TON", "VDA"
              };
          
              private final int[] strength = {
                      88, 87, 86, 81, 78, 75, 72, 71, 70, 72, 68, 71, 69, 67, 70, 67, 66, 65
              };
          
              private final int[] budgets = {
                      42, 38, 36, 20, 12, 10, 8, 9, 7, 10, 6, 8, 7, 6, 8, 6, 5, 5
              };
          
              private final int[] defaultPrimary = {
                      0xFFE53935, 0xFF1B8F4D, 0xFF1565C0, 0xFFD32F2F, 0xFFF5F5F5, 0xFF1565C0,
                      0xFF2E7D32, 0xFF2E7D32, 0xFFD32F2F, 0xFFFBC02D, 0xFF20252B, 0xFFD32F2F,
                      0xFF20252B, 0xFFD32F2F, 0xFFFBC02D, 0xFFD32F2F, 0xFF2E7D32, 0xFFD32F2F
              };
          
              private final int[] defaultSecondary = {
                      0xFFF5F5F5, 0xFFF5F5F5, 0xFFF5F5F5, 0xFFF5F5F5, 0xFF20252B, 0xFFF5F5F5,
                      0xFFF5F5F5, 0xFFF5F5F5, 0xFF1565C0, 0xFF1565C0, 0xFFF5F5F5, 0xFFF5F5F5,
                      0xFFF5F5F5, 0xFF1565C0, 0xFF1565C0, 0xFFF5F5F5, 0xFFFBC02D, 0xFFF5F5F5
              };
          
              private final String[] paletteNames = {
                      "Red", "Green", "Blue", "Yellow", "Orange", "Purple", "Black", "White", "Sky Blue", "Pink"
              };
          
              private final int[] palette = {
                      0xFFE53935, 0xFF2E7D32, 0xFF1565C0, 0xFFFBC02D, 0xFFF57C00,
                      0xFF7B1FA2, 0xFF20252B, 0xFFF5F5F5, 0xFF039BE5, 0xFFD81B60
              };
          
              private final String[] clubNames = new String[18];
              private final int[] primaryColours = new int[18];
              private final int[] secondaryColours = new int[18];
          
              private final int[] played = new int[18];
              private final int[] won = new int[18];
              private final int[] drawn = new int[18];
              private final int[] lost = new int[18];
              private final int[] goalsFor = new int[18];
              private final int[] goalsAgainst = new int[18];
              private final int[] points = new int[18];
          
              private final ArrayList<Player> players = new ArrayList<>();
              private final Random random = new Random();
          
              private SharedPreferences prefs;
              private int selectedClub = -1;
              private int selectedSlot = -1;
              private int matchday = 0;
              private LocalDate currentDate = SEASON_START;
              private String trainingFocus = "Balanced";
          
              // Classic 2D live match engine
              private final Handler matchHandler = new Handler(Looper.getMainLooper());
              private Runnable matchRunnable;
              private boolean liveMatchActive = false;
              private boolean livePaused = false;
              private int liveSpeed = 1;
              private float liveMinuteFloat = 0f;
              private int liveMinute = 0;
              private int liveHome = -1;
              private int liveAway = -1;
              private int liveHomeGoals = 0;
              private int liveAwayGoals = 0;
              private int liveHomeShots = 0;
              private int liveAwayShots = 0;
              private int liveHomeOnTarget = 0;
              private int liveAwayOnTarget = 0;
              private int liveHomePossession = 50;
              private int liveAwayPossession = 50;
              private int liveHomeCorners = 0;
              private int liveAwayCorners = 0;
              private String liveCommentary = "The teams are ready.";
              private String liveMentality = "Balanced";
              private String liveFormation = "4-3-3";
              private final ArrayList<int[]> liveOtherFixtures = new ArrayList<>();
              private MatchPitchView livePitchView;
              private TextView liveScoreText;
              private TextView liveClockText;
              private TextView liveCommentaryText;
              private TextView liveStatsText;
          
              private final int background = Color.rgb(7, 21, 31);
              private final int panel = Color.rgb(15, 42, 54);
              private final int panelLight = Color.rgb(22, 55, 69);
              private final int accent = Color.rgb(40, 190, 115);
              private final int danger = Color.rgb(185, 55, 62);
              private final int warning = Color.rgb(230, 150, 35);
              private final int text = Color.WHITE;
              private final int muted = Color.rgb(180, 196, 205);
          
              private static class Player {
                  int id;
                  int team;
                  String name;
                  String position;
                  int age;
                  int overall;
                  int pace;
                  int technique;
                  int passing;
                  int finishing;
                  int defending;
                  int physical;
                  int appearances;
                  int goals;
                  int assists;
                  int fitness;
                  int morale;
                  int valueMillions;
                  int contractYears;
                  boolean transferListed;
                  boolean loanListed;
          
                  Player(int id, int team) {
                      this.id = id;
                      this.team = team;
                  }
              }
          
              private static class CalendarEvent {
                  LocalDate date;
                  String competition;
                  String stage;
          
                  CalendarEvent(int year, int month, int day, String competition, String stage) {
                      this.date = LocalDate.of(year, month, day);
                      this.competition = competition;
                      this.stage = stage;
                  }
              }
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(background);
                  getWindow().setNavigationBarColor(background);
                  prefs = getSharedPreferences("project_mister", MODE_PRIVATE);
                  loadEditorData();
                  generatePlayers();
                  showMainMenu();
              }
          
              private LinearLayout createPage(String title, String subtitle, boolean showHome) {
                  stopLiveMatchTicker();
                  ScrollView scroll = new ScrollView(this);
                  scroll.setBackgroundColor(background);
          
                  LinearLayout page = new LinearLayout(this);
                  page.setOrientation(LinearLayout.VERTICAL);
                  page.setPadding(dp(20), dp(24), dp(20), dp(36));
                  scroll.addView(page);
          
                  TextView brand = makeText("PROJECT MISTER", 13, accent);
                  brand.setTypeface(Typeface.DEFAULT_BOLD);
                  page.addView(brand);
          
                  TextView heading = makeText(title, 30, text);
                  heading.setTypeface(Typeface.DEFAULT_BOLD);
                  heading.setPadding(0, dp(8), 0, dp(4));
                  page.addView(heading);
          
                  TextView sub = makeText(subtitle, 15, muted);
                  sub.setPadding(0, 0, 0, dp(14));
                  page.addView(sub);
          
                  if (showHome) {
                      Button home = makeButton("⌂  Career Hub / Saved Games", v -> {
                          saveCurrentGame();
                          showMainMenu();
                      });
                      home.setBackground(rounded(panel));
                      page.addView(home);
                  }
          
                  setContentView(scroll);
                  return page;
              }
          
              private TextView makeText(String value, int size, int colour) {
                  TextView tv = new TextView(this);
                  tv.setText(value);
                  tv.setTextSize(size);
                  tv.setTextColor(colour);
                  tv.setLineSpacing(0, 1.12f);
                  return tv;
              }
          
              private GradientDrawable rounded(int colour) {
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(colour);
                  bg.setCornerRadius(dp(14));
                  return bg;
              }
          
              private Button makeButton(String label, View.OnClickListener click) {
                  Button button = new Button(this);
                  button.setText(label);
                  button.setTextSize(16);
                  button.setTextColor(Color.WHITE);
                  button.setAllCaps(false);
                  button.setBackground(rounded(panelLight));
                  button.setPadding(dp(14), dp(10), dp(14), dp(10));
          
                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                  );
                  params.setMargins(0, 0, 0, dp(10));
                  button.setLayoutParams(params);
                  if (click != null) button.setOnClickListener(click);
                  return button;
              }
          
              private Button makeAccentButton(String label, View.OnClickListener click) {
                  Button button = makeButton(label, click);
                  button.setBackground(rounded(accent));
                  return button;
              }
          
              private LinearLayout makePanel() {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(16), dp(16), dp(16), dp(16));
                  box.setBackground(rounded(panel));
          
                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                  );
                  params.setMargins(0, 0, 0, dp(14));
                  box.setLayoutParams(params);
                  return box;
              }
          
              private View makeSwatch(int colour) {
                  View v = new View(this);
                  v.setBackground(rounded(colour));
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(dp(22), dp(22));
                  lp.setMargins(0, 0, dp(8), 0);
                  v.setLayoutParams(lp);
                  return v;
              }
          
              private LinearLayout makeClubIdentityRow(int club) {
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  row.addView(makeSwatch(primaryColours[club]));
                  row.addView(makeSwatch(secondaryColours[club]));
          
                  TextView name = makeText(clubNames[club], 18, text);
                  name.setTypeface(Typeface.DEFAULT_BOLD);
                  name.setPadding(dp(4), 0, 0, 0);
                  row.addView(name);
                  return row;
              }
          
              private void showMainMenu() {
                  LinearLayout page = createPage("Career Hub", "Three career saves • Project Mister v0.4", false);
          
                  for (int slot = 0; slot < SAVE_SLOTS; slot++) {
                      final int s = slot;
                      LinearLayout box = makePanel();
          
                      TextView slotTitle = makeText("SAVE " + (slot + 1), 13, accent);
                      slotTitle.setTypeface(Typeface.DEFAULT_BOLD);
                      box.addView(slotTitle);
          
                      if (slotExists(slot)) {
                          int club = prefs.getInt(key(slot, "club"), 0);
                          int md = prefs.getInt(key(slot, "matchday"), 0);
                          int pts = getSavedPoints(slot, club);
                          String date = prefs.getString(key(slot, "date"), SEASON_START.toString());
          
                          TextView details = makeText(
                                  clubNames[club] + "\nMatchday " + md + "  •  " + pts + " pts\n" + date,
                                  18,
                                  text
                          );
                          details.setTypeface(Typeface.DEFAULT_BOLD);
                          details.setPadding(0, dp(8), 0, dp(12));
                          box.addView(details);
          
                          box.addView(makeAccentButton("Continue Career", v -> {
                              loadSave(s);
                              showDashboard();
                          }));
          
                          Button delete = makeButton("Delete Save", v -> confirmDeleteSave(s));
                          delete.setBackground(rounded(danger));
                          box.addView(delete);
                      } else {
                          TextView empty = makeText("Empty career slot\nStart a new journey in Portugal.", 17, muted);
                          empty.setPadding(0, dp(8), 0, dp(12));
                          box.addView(empty);
          
                          box.addView(makeAccentButton("Start New Career", v -> {
                              selectedSlot = s;
                              resetCareerState();
                              generatePlayers();
                              showClubSelection();
                          }));
                      }
          
                      page.addView(box);
                  }
          
                  TextView editorTitle = makeText("GAME TOOLS", 13, muted);
                  editorTitle.setTypeface(Typeface.DEFAULT_BOLD);
                  editorTitle.setPadding(0, dp(6), 0, dp(8));
                  page.addView(editorTitle);
                  page.addView(makeButton("✏  Game Editor — Teams & Colours", v -> showTeamEditor()));
              }
          
              private void showClubSelection() {
                  LinearLayout page = createPage(
                          "Choose your club",
                          "Save " + (selectedSlot + 1) + " • Portugal 2026/27",
                          true
                  );
          
                  for (int i = 0; i < clubNames.length; i++) {
                      final int club = i;
                      LinearLayout box = makePanel();
                      box.addView(makeClubIdentityRow(club));
          
                      TextView info = makeText(
                              "Strength " + strength[i] + "/100   •   Budget €" + budgets[i] + "m\nEurope: " + europeanCompetitionForClub(i),
                              14,
                              muted
                      );
                      info.setPadding(0, dp(8), 0, dp(10));
                      box.addView(info);
          
                      box.addView(makeButton("Manage " + clubNames[i], v -> {
                          selectedClub = club;
                          resetCareerState();
                          generatePlayers();
                          saveCurrentGame();
                          showDashboard();
                      }));
                      page.addView(box);
                  }
              }
          
              private void showDashboard() {
                  LinearLayout page = createPage(
                          clubNames[selectedClub],
                          "Save " + (selectedSlot + 1) + " • " + currentDate.format(DATE_FORMAT) + " • Matchday " + (matchday + 1),
                          true
                  );
          
                  LinearLayout identity = makePanel();
                  identity.addView(makeClubIdentityRow(selectedClub));
          
                  TextView info = makeText(
                          "\nStrength          " + strength[selectedClub] + "/100\n"
                                  + "Transfer budget   €" + budgets[selectedClub] + "m\n"
                                  + "League points     " + points[selectedClub] + "\n"
                                  + "Matches played    " + played[selectedClub] + "\n"
                                  + "Training focus    " + trainingFocus + "\n"
                                  + "Transfer window   " + transferWindowStatus(currentDate) + "\n"
                                  + "Europe            " + europeanCompetitionForClub(selectedClub),
                          16,
                          text
                  );
                  identity.addView(info);
                  page.addView(identity);
          
                  page.addView(makeAccentButton("⚽  Watch Next Match Live", v -> startLiveMatchday()));
                  page.addView(makeButton("👥  Squad & Player Profiles", v -> showTeamPlayers(selectedClub)));
                  page.addView(makeButton("🌍  All Teams / Player Database", v -> showAllTeamsPlayers()));
                  page.addView(makeButton("🔄  Transfers & Loan Lists", v -> showTransferHub()));
                  page.addView(makeButton("🏃  Training", v -> showTraining()));
                  page.addView(makeButton("📅  Competition Calendar", v -> showCompetitionCalendar()));
                  page.addView(makeButton("🏆  League Table", v -> showLeagueTable()));
              }
          
              private void startLiveMatchday() {
                  List<Integer> order = new ArrayList<>();
                  for (int i = 0; i < clubNames.length; i++) order.add(i);
                  Collections.shuffle(order, random);
          
                  int selectedPosition = order.indexOf(selectedClub);
                  Collections.swap(order, 0, selectedPosition);
                  if (random.nextBoolean()) Collections.swap(order, 0, 1);
          
                  liveHome = order.get(0);
                  liveAway = order.get(1);
                  liveOtherFixtures.clear();
                  for (int i = 2; i < order.size(); i += 2) {
                      liveOtherFixtures.add(new int[]{order.get(i), order.get(i + 1)});
                  }
          
                  liveHomeGoals = 0;
                  liveAwayGoals = 0;
                  liveHomeShots = 0;
                  liveAwayShots = 0;
                  liveHomeOnTarget = 0;
                  liveAwayOnTarget = 0;
                  liveHomeCorners = 0;
                  liveAwayCorners = 0;
                  liveHomePossession = 50;
                  liveAwayPossession = 50;
                  liveMinuteFloat = 0f;
                  liveMinute = 0;
                  liveSpeed = 1;
                  livePaused = false;
                  liveMentality = "Balanced";
                  liveFormation = "4-3-3";
                  liveCommentary = "Kick-off is moments away.";
          
                  showLiveMatch();
              }
          
              private void showLiveMatch() {
                  stopLiveMatchTicker();
          
                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  scroll.setBackgroundColor(background);
          
                  LinearLayout page = new LinearLayout(this);
                  page.setOrientation(LinearLayout.VERTICAL);
                  page.setPadding(dp(12), dp(12), dp(12), dp(24));
                  scroll.addView(page);
          
                  LinearLayout scoreboard = makePanel();
                  scoreboard.setPadding(dp(12), dp(10), dp(12), dp(10));
          
                  LinearLayout teams = new LinearLayout(this);
                  teams.setOrientation(LinearLayout.HORIZONTAL);
                  teams.setGravity(Gravity.CENTER_VERTICAL);
          
                  TextView home = makeText(clubNames[liveHome], 16, text);
                  home.setTypeface(Typeface.DEFAULT_BOLD);
                  home.setGravity(Gravity.START);
                  teams.addView(home, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
          
                  liveScoreText = makeText("0  -  0", 26, text);
                  liveScoreText.setTypeface(Typeface.DEFAULT_BOLD);
                  liveScoreText.setGravity(Gravity.CENTER);
                  teams.addView(liveScoreText, new LinearLayout.LayoutParams(dp(110), LinearLayout.LayoutParams.WRAP_CONTENT));
          
                  TextView away = makeText(clubNames[liveAway], 16, text);
                  away.setTypeface(Typeface.DEFAULT_BOLD);
                  away.setGravity(Gravity.END);
                  teams.addView(away, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
          
                  scoreboard.addView(teams);
          
                  liveClockText = makeText("0'  •  1st Half  •  x1", 14, accent);
                  liveClockText.setGravity(Gravity.CENTER);
                  liveClockText.setPadding(0, dp(4), 0, 0);
                  scoreboard.addView(liveClockText);
                  page.addView(scoreboard);
          
                  liveCommentaryText = makeText(liveCommentary, 16, Color.WHITE);
                  liveCommentaryText.setTypeface(Typeface.DEFAULT_BOLD);
                  liveCommentaryText.setGravity(Gravity.CENTER);
                  liveCommentaryText.setPadding(dp(12), dp(12), dp(12), dp(12));
                  liveCommentaryText.setBackground(rounded(primaryColours[liveAway]));
                  LinearLayout.LayoutParams commParams = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                  );
                  commParams.setMargins(0, 0, 0, dp(10));
                  liveCommentaryText.setLayoutParams(commParams);
                  page.addView(liveCommentaryText);
          
                  livePitchView = new MatchPitchView();
                  LinearLayout.LayoutParams pitchParams = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          dp(440)
                  );
                  pitchParams.setMargins(0, 0, 0, dp(10));
                  livePitchView.setLayoutParams(pitchParams);
                  page.addView(livePitchView);
          
                  LinearLayout speedRow = new LinearLayout(this);
                  speedRow.setOrientation(LinearLayout.HORIZONTAL);
                  speedRow.setGravity(Gravity.CENTER);
          
                  Button x1 = compactButton("x1", v -> setLiveSpeed(1));
                  Button x2 = compactButton("x2", v -> setLiveSpeed(2));
                  Button x3 = compactButton("x3", v -> setLiveSpeed(3));
                  Button pause = compactButton("Ⅱ / ▶", v -> {
                      livePaused = !livePaused;
                      refreshLiveHeader();
                  });
          
                  speedRow.addView(x1, compactParams());
                  speedRow.addView(x2, compactParams());
                  speedRow.addView(x3, compactParams());
                  speedRow.addView(pause, compactParams());
                  page.addView(speedRow);
          
                  LinearLayout tabs = new LinearLayout(this);
                  tabs.setOrientation(LinearLayout.HORIZONTAL);
                  tabs.addView(compactButton("Overview", v -> showLiveOverviewDialog()), compactParams());
                  tabs.addView(compactButton("Match Stats", v -> showLiveStatsDialog()), compactParams());
                  tabs.addView(compactButton("Ratings", v -> showLiveRatingsDialog()), compactParams());
                  page.addView(tabs);
          
                  liveStatsText = makeText(liveStatsSummary(), 14, text);
                  liveStatsText.setBackground(rounded(panel));
                  liveStatsText.setPadding(dp(12), dp(10), dp(12), dp(10));
                  page.addView(liveStatsText);
          
                  TextView tacticsLabel = makeText("MATCH CONTROLS", 12, muted);
                  tacticsLabel.setTypeface(Typeface.DEFAULT_BOLD);
                  tacticsLabel.setPadding(0, dp(12), 0, dp(6));
                  page.addView(tacticsLabel);
          
                  page.addView(makeButton("Formation  •  " + liveFormation, v -> showFormationDialog()));
