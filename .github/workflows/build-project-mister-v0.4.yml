              private Player bestPlayerForTeam(int team) {
                  Player best = null;
                  for (Player p : players) {
                      if (p.team == team && (best == null || p.overall > best.overall)) best = p;
                  }
                  return best;
              }
          
              private void showTeamPlayers(int team) {
