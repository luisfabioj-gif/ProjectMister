              private void showPlayerInstructions(Player p, int returnTeam) {
                  String[] labels = {
                          (p.freeRole ? "✓ " : "") + "Free Role",
                          (p.forwardRuns ? "✓ " : "") + "Forward Runs",
                          (p.runWithBall ? "✓ " : "") + "Run With Ball",
