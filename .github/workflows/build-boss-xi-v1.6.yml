                      String status = "";
                      if (p.transferListed) status += "  [T]";
                      if (p.loanListed) status += "  [L]";
                      if (p.onLoan) status += "  [LOAN]";
                      if (team == selectedClub) status += "  [" + tacticsStatusLabel(p.id) + "]";
                      String label = p.position + "  " + p.name + "   " + knownOverallLabel(p) + status;
