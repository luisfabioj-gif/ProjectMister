              private void hireStaff(String role) {
                  final String[] candidates;
                  final int[] ratings;
                  if ("Assistant Manager".equals(role)) {
                      candidates = new String[]{"Miguel Duarte", "Paulo Simões", "Helder Costa"};
                      ratings = new int[]{68, 74, 79};
