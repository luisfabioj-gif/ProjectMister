name: BOSS XI v2.3 candidate — source build and feature QA
on:
  workflow_dispatch:
  push:
    branches: [work/boss-xi-v2.3]
    paths: ['app/**', 'tools/**', 'tests/**', '*.gradle', '.github/workflows/build-boss-xi-v2.3.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Required SDK
        run: sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0'
      - name: Core regression tests
        run: bash tools/test-core.sh
      - name: Build committed source directly
        run: gradle :app:assembleDebug :app:bundleRelease --no-daemon
      - name: Build independent QA runner
        run: bash tools/build-test-sdk.sh
      - name: Build preserved baseline for upgrade test
        run: |
          git worktree add --detach /tmp/boss-baseline 73275b274b02c3273e72d9710f0639a54f29d590
          cd /tmp/boss-baseline
          gradle :app:assembleDebug --no-daemon
      - name: Fetch pinned official bundletool for release installation QA
        run: |
          mkdir -p app/build/toolchain
          curl --fail --location --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o app/build/toolchain/bundletool.jar
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  app/build/toolchain/bundletool.jar' | sha256sum --check
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator startup, upgrade, navigation and match regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/qa-device.sh
      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BOSS-XI-v2.3-QA-api${{ matrix.api }}
          path: qa-output/
          retention-days: 30
      - name: Upload unsigned release bundle for packaging review
        uses: actions/upload-artifact@v4
        with:
          name: BOSS-XI-unsigned-release-bundle-api${{ matrix.api }}-NOT-FOR-UPLOAD
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Upload verified candidate
        uses: actions/upload-artifact@v4
        with:
          name: BOSS-XI-v2.3-candidate-apk-api${{ matrix.api }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
