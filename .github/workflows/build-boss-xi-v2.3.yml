name: BOSS XI v2.3 candidate — source build and feature QA
on:
  workflow_dispatch:
  push:
    branches: [work/boss-xi-v2.3]
    paths: ['app/**', 'tools/**', 'tests/**', '*.gradle', '.github/workflows/build-boss-xi-v2.3.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Required SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Core regression tests
        run: bash tools/test-core.sh
      - name: Build committed source directly
        run: gradle :app:assembleDebug --no-daemon
      - name: Build independent QA runner
        run: bash tools/build-test-sdk.sh
      - name: Build preserved baseline for upgrade test
        run: |
          git worktree add --detach /tmp/boss-baseline 73275b274b02c3273e72d9710f0639a54f29d590
          cd /tmp/boss-baseline
          gradle :app:assembleDebug --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator startup, upgrade, navigation and match regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/qa-device.sh
      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BOSS-XI-v2.3-QA
          path: qa-output/
          retention-days: 30
      - name: Upload verified candidate
        uses: actions/upload-artifact@v4
        with:
          name: BOSS-XI-v2.3-candidate-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
