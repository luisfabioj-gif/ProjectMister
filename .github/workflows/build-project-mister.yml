      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Project-Mister-v0.2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
