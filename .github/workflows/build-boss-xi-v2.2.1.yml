          STAFF_METHODS = '              private void showStaffHub() {\n                  backAction = () -> showDashboard();\n                  LinearLayout page = createPage("Staff", "First-team football department", true);\n\n                  LinearLayout intro = makePanel();\n                  intro.addView(profileSectionTitle("FOOTBALL DEPARTMENT"));\n                  intro.addView(makeText(\n                          "Your senior staff influence match preparation, training quality, player development and recruitment knowledge.",\n                          14,\n                          text\n                  ));\n                  page.addView(intro);\n\n                  page.addView(staffCard("Assistant Manager", assistantManagerName, assistantManagerRating,\n                          "Tactical preparation, motivation and match feedback.", () -> hireStaff("Assistant Manager")));\n                  page.addView(staffCard("Head Coach", headCoachName, headCoachRating,\n                          "Training quality, technical coaching and player development.", () -> hireStaff("Head Coach")));\n                  page.addView(staffCard("Chief Scout", chiefScoutName, chiefScoutRating,\n                          "Player identification, potential judgement and recruitment knowledge.", () -> hireStaff("Chief Scout")));\n              }\n\n              private LinearLayout staffCard(String role, String name, int rating, String desc, Runnable action) {\n                  LinearLayout box = makePanel();\n                  LinearLayout top = new LinearLayout(this);\n                  top.setOrientation(LinearLayout.HORIZONTAL);\n                  top.setGravity(Gravity.CENTER_VERTICAL);\n\n                  View portrait = new RealisticHumanPortraitView(\n                          name.hashCode() + role.hashCode(),\n                          role,\n                          primaryColours[selectedClub],\n                          secondaryColours[selectedClub],\n                          38 + Math.abs(name.hashCode() % 19),\n                          false\n                  );\n                  LinearLayout.LayoutParams pp = new LinearLayout.LayoutParams(dp(82), dp(104));\n                  pp.setMargins(0, 0, dp(13), 0);\n                  top.addView(portrait, pp);\n\n                  LinearLayout info = new LinearLayout(this);\n                  info.setOrientation(LinearLayout.VERTICAL);\n                  info.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));\n                  TextView roleText = makeText(role.toUpperCase(Locale.UK), 11, accent);\n                  roleText.setTypeface(Typeface.DEFAULT_BOLD);\n                  roleText.setLetterSpacing(0.04f);\n                  info.addView(roleText);\n                  TextView nameText = makeText(name, 19, text);\n                  nameText.setTypeface(Typeface.DEFAULT_BOLD);\n                  info.addView(nameText);\n                  info.addView(makeText("Staff rating  " + rating + "/100", 13, rating >= 75 ? accent : text));\n                  TextView descView = makeText(desc, 12, muted);\n                  descView.setPadding(0, dp(5), 0, 0);\n                  info.addView(descView);\n                  top.addView(info);\n                  box.addView(top);\n\n                  LinearLayout buttons = new LinearLayout(this);\n                  buttons.setOrientation(LinearLayout.HORIZONTAL);\n                  buttons.setPadding(0, dp(10), 0, 0);\n                  Button view = makeAccentButton("View Profile", v -> showStaffProfile(role));\n                  Button replace = makeButton("Hire / Replace", v -> action.run());\n                  LinearLayout.LayoutParams bp = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);\n                  bp.setMargins(0, 0, dp(4), 0);\n                  buttons.addView(view, bp);\n                  LinearLayout.LayoutParams bp2 = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);\n                  bp2.setMargins(dp(4), 0, 0, 0);\n                  buttons.addView(replace, bp2);\n                  box.addView(buttons);\n                  return box;\n              }\n\n              private void showStaffProfile(String role) {\n                  backAction = () -> showStaffHub();\n                  String name = profileStaffName(role);\n                  int rating = profileStaffRating(role);\n                  int age = 38 + Math.abs(name.hashCode() % 19);\n                  LinearLayout page = createPage(role + " Profile", clubNames[selectedClub] + " • " + name, true);\n\n                  LinearLayout hero = makePanel();\n                  hero.setBackground(rounded(Color.rgb(9, 31, 43)));\n                  LinearLayout top = new LinearLayout(this);\n                  top.setOrientation(LinearLayout.HORIZONTAL);\n                  top.setGravity(Gravity.TOP);\n\n                  View portrait = new RealisticHumanPortraitView(\n                          name.hashCode() + role.hashCode(), role,\n                          primaryColours[selectedClub], secondaryColours[selectedClub], age, false\n                  );\n                  LinearLayout.LayoutParams pp = new LinearLayout.LayoutParams(dp(122), dp(154));\n                  pp.setMargins(0, 0, dp(16), 0);\n                  top.addView(portrait, pp);\n\n                  LinearLayout info = new LinearLayout(this);\n                  info.setOrientation(LinearLayout.VERTICAL);\n                  info.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));\n                  TextView roleText = makeText(role.toUpperCase(Locale.UK), 12, accent);\n                  roleText.setTypeface(Typeface.DEFAULT_BOLD);\n                  info.addView(roleText);\n                  TextView staffName = makeText(name, 24, text);\n                  staffName.setTypeface(Typeface.DEFAULT_BOLD);\n                  staffName.setPadding(0, dp(3), 0, dp(6));\n                  info.addView(staffName);\n                  info.addView(makeText("Portugal  •  Age " + age + "\\n" + clubNames[selectedClub], 13, muted));\n                  top.addView(info);\n                  hero.addView(top);\n\n                  LinearLayout metrics = new LinearLayout(this);\n                  metrics.setOrientation(LinearLayout.HORIZONTAL);\n                  metrics.setPadding(0, dp(14), 0, 0);\n                  metrics.addView(profileMetricCard("RATING", rating + "/100", rating >= 75 ? accent : text));\n                  metrics.addView(profileMetricCard("CONTRACT", "Rolling", Color.rgb(87, 166, 221)));\n                  metrics.addView(profileMetricCard("WAGE", "€" + profileStaffWeeklyWageK(rating) + "k", Color.rgb(231, 179, 70)));\n                  hero.addView(metrics);\n                  page.addView(hero);\n\n                  LinearLayout abilities = makePanel();\n                  abilities.addView(profileSectionTitle("KEY ATTRIBUTES • 1–20"));\n                  String[] labels = profileStaffAttributeLabels(role);\n                  for (int i = 0; i < labels.length; i++) {\n                      int value = profileStaffAttribute(rating, role, i);\n                      int colour = i % 3 == 0 ? accent : i % 3 == 1 ? Color.rgb(87, 166, 221) : Color.rgb(231, 179, 70);\n                      abilities.addView(makeModernAttributeRow(labels[i], value, colour));\n                  }\n                  page.addView(abilities);\n\n                  LinearLayout impact = makePanel();\n                  impact.addView(profileSectionTitle("ROLE IMPACT"));\n                  impact.addView(makeText(profileStaffImpact(role, rating), 14, text));\n                  page.addView(impact);\n\n                  LinearLayout contract = makePanel();\n                  contract.addView(profileSectionTitle("EMPLOYMENT"));\n                  contract.addView(profileInfoRow("Club", clubNames[selectedClub]));\n                  contract.addView(profileInfoRow("Weekly wage", "€" + profileStaffWeeklyWageK(rating) + "k"));\n                  contract.addView(profileInfoRow("Contract", "Rolling first-team contract"));\n                  contract.addView(profileInfoRow("Reputation", rating >= 80 ? "Excellent" : rating >= 72 ? "Very good" : "Established"));\n                  page.addView(contract);\n\n                  page.addView(makeAccentButton("Hire / Replace " + role, v -> hireStaff(role)));\n                  page.addView(makeButton("← Back to Staff", v -> showStaffHub()));\n              }\n\n              private String profileStaffName(String role) {\n                  if ("Assistant Manager".equals(role)) return assistantManagerName;\n                  if ("Head Coach".equals(role)) return headCoachName;\n                  return chiefScoutName;\n              }\n\n              private int profileStaffRating(String role) {\n                  if ("Assistant Manager".equals(role)) return assistantManagerRating;\n                  if ("Head Coach".equals(role)) return headCoachRating;\n                  return chiefScoutRating;\n              }\n\n              private int profileStaffWeeklyWageK(int rating) {\n                  return Math.max(8, (rating - 45) * 2);\n              }\n\n              private String[] profileStaffAttributeLabels(String role) {\n                  if ("Assistant Manager".equals(role)) {\n                      return new String[]{"Tactical knowledge", "Motivating", "Man management", "Judging ability", "Discipline", "Adaptability"};\n                  }\n                  if ("Head Coach".equals(role)) {\n                      return new String[]{"Technical coaching", "Tactical coaching", "Fitness coaching", "Youth development", "Motivating", "Discipline"};\n                  }\n                  return new String[]{"Judging ability", "Judging potential", "Tactical knowledge", "Adaptability", "Player knowledge", "Negotiating"};\n              }\n\n              private int profileStaffAttribute(int rating, String role, int index) {\n                  int base = Math.max(7, Math.min(18, Math.round(rating / 5f)));\n                  int variation = Math.abs((role.hashCode() * 31 + index * 17 + rating) % 5) - 2;\n                  if (("Chief Scout".equals(role) && index < 2) || ("Head Coach".equals(role) && index < 2) || ("Assistant Manager".equals(role) && index < 3)) {\n                      variation += 1;\n                  }\n                  return Math.max(5, Math.min(20, base + variation));\n              }\n\n              private String profileStaffImpact(String role, int rating) {\n                  String grade = rating >= 80 ? "elite-level" : rating >= 74 ? "high-quality" : rating >= 68 ? "solid" : "developing";\n                  if ("Assistant Manager".equals(role)) {\n                      return "Provides " + grade + " support for tactical preparation, player motivation, opposition analysis and match feedback. A stronger assistant improves the quality of pre-match advice.";\n                  }\n                  if ("Head Coach".equals(role)) {\n                      return "Provides " + grade + " day-to-day coaching. Higher quality coaching supports training efficiency, player development and the consistency of technical work.";\n                  }\n                  return "Provides " + grade + " recruitment support. Better scouting improves player knowledge, confidence in potential estimates and the usefulness of recruitment reports.";\n              }\n'
          REALISTIC_CLASS = '              private class RealisticHumanPortraitView extends View {\n                  private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);\n                  private final RectF rect = new RectF();\n                  private final int seed;\n                  private final String role;\n                  private final int primary;\n                  private final int secondary;\n                  private final int ageHint;\n                  private final boolean footballKit;\n\n                  RealisticHumanPortraitView(int seed, String role, int primary, int secondary, int ageHint, boolean footballKit) {\n                      super(MainActivity.this);\n                      this.seed = seed;\n                      this.role = role == null ? "STAFF" : role;\n                      this.primary = primary;\n                      this.secondary = secondary;\n                      this.ageHint = Math.max(17, ageHint);\n                      this.footballKit = footballKit;\n                      setLayerType(View.LAYER_TYPE_HARDWARE, null);\n                  }\n\n                  private float portraitUnit(int salt) {\n                      long x = (long) seed * 1103515245L + salt * 12345L + 0x9E3779B9L;\n                      x ^= (x >>> 16);\n                      return (Math.abs(x) % 10000) / 9999f;\n                  }\n\n                  @Override\n                  protected void onDraw(Canvas canvas) {\n                      super.onDraw(canvas);\n                      float w = getWidth();\n                      float h = getHeight();\n                      if (w <= 0 || h <= 0) return;\n\n                      int[] skinTones = {\n                              Color.rgb(242, 207, 178), Color.rgb(226, 184, 148),\n                              Color.rgb(202, 151, 111), Color.rgb(166, 115, 79),\n                              Color.rgb(124, 82, 57), Color.rgb(91, 61, 46)\n                      };\n                      int skin = skinTones[Math.min(skinTones.length - 1, (int)(portraitUnit(4) * skinTones.length))];\n                      int hair = portraitUnit(5) < .18f ? Color.rgb(158, 111, 61)\n                              : portraitUnit(5) < .34f ? Color.rgb(91, 59, 37)\n                              : portraitUnit(5) < .48f ? Color.rgb(45, 37, 32)\n                              : portraitUnit(5) < .90f ? Color.rgb(24, 25, 26)\n                              : Color.rgb(175, 172, 166);\n                      int iris = portraitUnit(6) < .18f ? Color.rgb(70, 101, 112)\n                              : portraitUnit(6) < .36f ? Color.rgb(74, 98, 72)\n                              : portraitUnit(6) < .82f ? Color.rgb(92, 67, 45)\n                              : Color.rgb(48, 55, 58);\n\n                      paint.setShader(new android.graphics.LinearGradient(\n                              0, 0, w, h,\n                              Color.rgb(42, 55, 64), Color.rgb(8, 17, 23),\n                              android.graphics.Shader.TileMode.CLAMP));\n                      rect.set(0, 0, w, h);\n                      canvas.drawRoundRect(rect, dp(9), dp(9), paint);\n                      paint.setShader(null);\n\n                      // Soft studio light behind the subject.\n                      paint.setShader(new android.graphics.RadialGradient(\n                              w * .34f, h * .20f, w * .62f,\n                              Color.argb(82, 180, 205, 218), Color.TRANSPARENT,\n                              android.graphics.Shader.TileMode.CLAMP));\n                      canvas.drawRect(0, 0, w, h, paint);\n                      paint.setShader(null);\n\n                      float cx = w * (.50f + (portraitUnit(7) - .5f) * .025f);\n                      float faceCy = h * .37f;\n                      float faceW = w * (.32f + portraitUnit(8) * .045f);\n                      float faceH = h * (.335f + portraitUnit(9) * .025f);\n                      float left = cx - faceW / 2f;\n                      float right = cx + faceW / 2f;\n                      float top = faceCy - faceH / 2f;\n                      float bottom = faceCy + faceH / 2f;\n\n                      // Clothing and shoulders. Staff use a jacket/shirt rather than a football kit.\n                      if (footballKit) {\n                          paint.setShader(new android.graphics.LinearGradient(0, h*.63f, 0, h,\n                                  lighten(primary, 16), darken(primary, 30), android.graphics.Shader.TileMode.CLAMP));\n                          rect.set(w*.08f, h*.64f, w*.92f, h*1.03f);\n                          canvas.drawRoundRect(rect, dp(21), dp(21), paint);\n                          paint.setShader(null);\n                          paint.setColor(secondary);\n                          Path collar = new Path();\n                          collar.moveTo(w*.40f, h*.64f);\n                          collar.lineTo(w*.50f, h*.73f);\n                          collar.lineTo(w*.60f, h*.64f);\n                          collar.close();\n                          canvas.drawPath(collar, paint);\n                      } else {\n                          int jacket = Color.rgb(25, 32, 39);\n                          paint.setShader(new android.graphics.LinearGradient(0, h*.62f, 0, h,\n                                  lighten(jacket, 14), darken(jacket, 16), android.graphics.Shader.TileMode.CLAMP));\n                          rect.set(w*.08f, h*.63f, w*.92f, h*1.03f);\n                          canvas.drawRoundRect(rect, dp(21), dp(21), paint);\n                          paint.setShader(null);\n                          paint.setColor(Color.rgb(223, 226, 228));\n                          Path shirt = new Path();\n                          shirt.moveTo(w*.39f,h*.64f); shirt.lineTo(w*.50f,h*.79f); shirt.lineTo(w*.61f,h*.64f); shirt.close();\n                          canvas.drawPath(shirt,paint);\n                          paint.setColor(darken(primary, 6));\n                          Path leftLap = new Path();\n                          leftLap.moveTo(w*.11f,h*.67f); leftLap.lineTo(w*.39f,h*.62f); leftLap.lineTo(w*.50f,h*.80f); leftLap.lineTo(w*.35f,h*.74f); leftLap.close();\n                          canvas.drawPath(leftLap,paint);\n                          Path rightLap = new Path();\n                          rightLap.moveTo(w*.89f,h*.67f); rightLap.lineTo(w*.61f,h*.62f); rightLap.lineTo(w*.50f,h*.80f); rightLap.lineTo(w*.65f,h*.74f); rightLap.close();\n                          canvas.drawPath(rightLap,paint);\n                      }\n\n                      // Neck with side shading.\n                      paint.setShader(new android.graphics.LinearGradient(cx-faceW*.18f,0,cx+faceW*.18f,0,\n                              darken(skin, 25), lighten(skin, 8), android.graphics.Shader.TileMode.CLAMP));\n                      rect.set(cx-faceW*.18f, h*.51f, cx+faceW*.18f, h*.69f);\n                      canvas.drawRoundRect(rect, dp(6), dp(6), paint);\n                      paint.setShader(null);\n\n                      // Ears, kept small and anatomically placed.\n                      paint.setColor(darken(skin, 7));\n                      rect.set(left-dp(5), faceCy-faceH*.08f, left+dp(4), faceCy+faceH*.17f);\n                      canvas.drawOval(rect, paint);\n                      rect.set(right-dp(4), faceCy-faceH*.08f, right+dp(5), faceCy+faceH*.17f);\n                      canvas.drawOval(rect, paint);\n\n                      // Face silhouette with a narrower jaw and rounded temples.\n                      float jaw = .78f + portraitUnit(10) * .14f;\n                      Path face = new Path();\n                      face.moveTo(cx, top);\n                      face.cubicTo(cx-faceW*.42f, top, left, top+faceH*.26f, left+faceW*.03f, faceCy);\n                      face.cubicTo(left+faceW*.06f, bottom-faceH*.18f, cx-faceW*.24f*jaw, bottom, cx, bottom+dp(2));\n                      face.cubicTo(cx+faceW*.24f*jaw, bottom, right-faceW*.06f, bottom-faceH*.18f, right-faceW*.03f, faceCy);\n                      face.cubicTo(right, top+faceH*.26f, cx+faceW*.42f, top, cx, top);\n                      face.close();\n                      paint.setShader(new android.graphics.RadialGradient(\n                              cx-faceW*.18f, top+faceH*.30f, faceH*.77f,\n                              lighten(skin, 24), darken(skin, 32), android.graphics.Shader.TileMode.CLAMP));\n                      canvas.drawPath(face, paint);\n                      paint.setShader(null);\n\n                      // Temple and cheek shadow; subtle highlight on the opposite cheek.\n                      paint.setColor(Color.argb(34, 52, 30, 22));\n                      rect.set(cx+faceW*.08f, top+faceH*.25f, right-faceW*.02f, bottom-faceH*.05f);\n                      canvas.drawOval(rect, paint);\n                      paint.setColor(Color.argb(36, 255, 247, 230));\n                      rect.set(left+faceW*.15f, top+faceH*.27f, cx-faceW*.01f, bottom-faceH*.20f);\n                      canvas.drawOval(rect, paint);\n\n                      // Hair uses a natural hairline rather than a solid cartoon cap.\n                      int hairStyle = (int)(portraitUnit(11) * 6f);\n                      paint.setColor(hair);\n                      if (ageHint < 56 || hairStyle != 5) {\n                          Path hairPath = new Path();\n                          hairPath.moveTo(left+faceW*.04f, top+faceH*.24f);\n                          hairPath.cubicTo(left+faceW*.08f, top-faceH*.06f, cx-faceW*.20f, top-faceH*.10f, cx, top-faceH*.05f);\n                          hairPath.cubicTo(cx+faceW*.22f, top-faceH*.12f, right-faceW*.08f, top-faceH*.03f, right-faceW*.03f, top+faceH*.24f);\n                          hairPath.cubicTo(right-faceW*.18f, top+faceH*.13f, cx+faceW*.18f, top+faceH*.10f, cx, top+faceH*.14f);\n                          hairPath.cubicTo(cx-faceW*.20f, top+faceH*.09f, left+faceW*.16f, top+faceH*.15f, left+faceW*.04f, top+faceH*.24f);\n                          hairPath.close();\n                          canvas.drawPath(hairPath, paint);\n                          if (hairStyle == 1 || hairStyle == 4) {\n                              paint.setStrokeWidth(dp(2));\n                              for (int i = 0; i < 7; i++) {\n                                  float hx = left + faceW * (.16f + i*.11f);\n                                  canvas.drawLine(hx, top+faceH*.02f, hx+dp(3), top-faceH*.05f, paint);\n                              }\n                          }\n                      }\n\n                      float eyeY = top + faceH * .42f;\n                      float eyeDx = faceW * (.21f + (portraitUnit(12)-.5f)*.02f);\n                      float eyeW = faceW * .105f;\n                      float eyeH = faceH * .035f;\n\n                      // Brows with a slight natural angle.\n                      paint.setColor(darken(hair, 4));\n                      paint.setStrokeWidth(dp(2));\n                      canvas.drawLine(cx-eyeDx-eyeW*.8f, eyeY-eyeH*2.6f, cx-eyeDx+eyeW*.8f, eyeY-eyeH*2.9f, paint);\n                      canvas.drawLine(cx+eyeDx-eyeW*.8f, eyeY-eyeH*2.9f, cx+eyeDx+eyeW*.8f, eyeY-eyeH*2.6f, paint);\n\n                      // Eyes: narrower proportions, eyelid shadow, iris and catchlight.\n                      paint.setColor(Color.rgb(232, 230, 222));\n                      rect.set(cx-eyeDx-eyeW, eyeY-eyeH, cx-eyeDx+eyeW, eyeY+eyeH);\n                      canvas.drawOval(rect, paint);\n                      rect.set(cx+eyeDx-eyeW, eyeY-eyeH, cx+eyeDx+eyeW, eyeY+eyeH);\n                      canvas.drawOval(rect, paint);\n                      paint.setColor(iris);\n                      canvas.drawCircle(cx-eyeDx, eyeY, eyeH*.92f, paint);\n                      canvas.drawCircle(cx+eyeDx, eyeY, eyeH*.92f, paint);\n                      paint.setColor(Color.rgb(18, 18, 18));\n                      canvas.drawCircle(cx-eyeDx, eyeY, eyeH*.43f, paint);\n                      canvas.drawCircle(cx+eyeDx, eyeY, eyeH*.43f, paint);\n                      paint.setColor(Color.argb(215,255,255,255));\n                      canvas.drawCircle(cx-eyeDx-eyeH*.25f, eyeY-eyeH*.28f, Math.max(1f, eyeH*.18f), paint);\n                      canvas.drawCircle(cx+eyeDx-eyeH*.25f, eyeY-eyeH*.28f, Math.max(1f, eyeH*.18f), paint);\n                      paint.setColor(Color.argb(50, 35, 23, 18));\n                      paint.setStrokeWidth(dp(1));\n                      canvas.drawLine(cx-eyeDx-eyeW, eyeY+eyeH*.8f, cx-eyeDx+eyeW, eyeY+eyeH*.8f, paint);\n                      canvas.drawLine(cx+eyeDx-eyeW, eyeY+eyeH*.8f, cx+eyeDx+eyeW, eyeY+eyeH*.8f, paint);\n\n                      // Nose bridge and nostril shadow.\n                      float noseY = top + faceH * .59f;\n                      float noseLen = faceH * (.16f + portraitUnit(13)*.025f);\n                      paint.setColor(Color.argb(92, 80, 47, 34));\n                      paint.setStrokeWidth(dp(1.25f));\n                      canvas.drawLine(cx+dp(1), eyeY+eyeH*2.2f, cx-dp(1.5f), noseY+noseLen*.62f, paint);\n                      canvas.drawLine(cx-dp(1.5f), noseY+noseLen*.62f, cx+dp(4.2f), noseY+noseLen*.72f, paint);\n                      paint.setColor(Color.argb(48,255,255,255));\n                      canvas.drawLine(cx-dp(3), eyeY+eyeH*2.4f, cx-dp(3), noseY+noseLen*.52f, paint);\n\n                      // Mouth with understated lip shape.\n                      float mouthY = top + faceH * .77f;\n                      float mouthW = faceW * (.16f + portraitUnit(14)*.025f);\n                      paint.setColor(Color.rgb(124, 74, 70));\n                      paint.setStrokeWidth(dp(1.35f));\n                      Path mouth = new Path();\n                      mouth.moveTo(cx-mouthW, mouthY);\n                      mouth.quadTo(cx, mouthY+dp(2), cx+mouthW, mouthY);\n                      canvas.drawPath(mouth, paint);\n                      paint.setColor(Color.argb(60,255,232,225));\n                      canvas.drawLine(cx-mouthW*.45f, mouthY-dp(.8f), cx+mouthW*.34f, mouthY-dp(.8f), paint);\n\n                      // Stubble/beard is translucent so facial volume remains visible.\n                      boolean beard = footballKit ? portraitUnit(15) < .34f : portraitUnit(15) < .48f;\n                      if (beard) {\n                          paint.setColor(Color.argb(ageHint > 45 ? 64 : 48, Color.red(hair), Color.green(hair), Color.blue(hair)));\n                          Path beardPath = new Path();\n                          beardPath.moveTo(left+faceW*.12f, top+faceH*.64f);\n                          beardPath.cubicTo(left+faceW*.13f, bottom-faceH*.05f, cx-faceW*.18f, bottom, cx, bottom+dp(1));\n                          beardPath.cubicTo(cx+faceW*.18f, bottom, right-faceW*.13f, bottom-faceH*.05f, right-faceW*.12f, top+faceH*.64f);\n                          beardPath.cubicTo(cx+faceW*.18f, top+faceH*.84f, cx-faceW*.18f, top+faceH*.84f, left+faceW*.12f, top+faceH*.64f);\n                          beardPath.close();\n                          canvas.drawPath(beardPath, paint);\n                      }\n\n                      // Age detail is deliberately subtle rather than caricatured.\n                      if (ageHint >= 36) {\n                          paint.setColor(Color.argb(Math.min(62, 18 + (ageHint-35)*2), 72, 51, 43));\n                          paint.setStrokeWidth(dp(.8f));\n                          canvas.drawLine(cx-eyeDx-eyeW*.95f, eyeY+eyeH*2.0f, cx-eyeDx-eyeW*.15f, eyeY+eyeH*1.55f, paint);\n                          canvas.drawLine(cx+eyeDx+eyeW*.15f, eyeY+eyeH*1.55f, cx+eyeDx+eyeW*.95f, eyeY+eyeH*2.0f, paint);\n                      }\n                      if (ageHint >= 48) {\n                          paint.setColor(Color.argb(35, 80, 58, 48));\n                          canvas.drawLine(cx-faceW*.13f, top+faceH*.25f, cx+faceW*.13f, top+faceH*.245f, paint);\n                          canvas.drawLine(cx-faceW*.11f, top+faceH*.29f, cx+faceW*.11f, top+faceH*.285f, paint);\n                      }\n\n                      // Subtle vignette and frame, like a photographic profile card.\n                      paint.setStyle(Paint.Style.STROKE);\n                      paint.setStrokeWidth(dp(1.4f));\n                      paint.setColor(Color.argb(105, 255, 255, 255));\n                      rect.set(dp(1), dp(1), w-dp(1), h-dp(1));\n                      canvas.drawRoundRect(rect, dp(9), dp(9), paint);\n                      paint.setStyle(Paint.Style.FILL);\n                  }\n              }\n\n'
          
          player_pattern = re.compile(r"(?ms)^              private void showPlayerProfile\(int playerId, int returnTeam\) \{.*?^              \}\n\s*\n              private class ClassicPortraitView")
          s, n = player_pattern.subn(lambda m: PLAYER_PROFILE + "\n              private class ClassicPortraitView", s, count=1)
          if n != 1:
              raise SystemExit(f"Player profile replacement count: {n}")
          
          manager_pattern = re.compile(r"(?ms)^              private void showManagerProfile\(\) \{.*?^              \}\n\s*\n              private LinearLayout makeManagerProfileRow")
          s, n = manager_pattern.subn(lambda m: MANAGER_PROFILE + "\n              private LinearLayout makeManagerProfileRow", s, count=1)
          if n != 1:
              raise SystemExit(f"Manager profile replacement count: {n}")
          
          staff_pattern = re.compile(r"(?ms)^              private void showStaffHub\(\) \{.*?^              \}\n\s*\n              private void hireStaff")
          s, n = staff_pattern.subn(lambda m: STAFF_METHODS + "\n              private void hireStaff", s, count=1)
          if n != 1:
              raise SystemExit(f"Staff hub replacement count: {n}")
          
          portrait_marker = "              private class ClassicPortraitView extends View {"
          if portrait_marker not in s:
              raise SystemExit("Classic portrait insertion marker not found.")
          s = s.replace(portrait_marker, REALISTIC_CLASS + portrait_marker, 1)
          
          s = s.replace(
              "Three career saves • BOSS XI v2.2 • Finance, Stadium & Match Audio",
              "Three career saves • BOSS XI v2.2.1 • Profile Overhaul",
              1
          )
          java_path.write_text(s, encoding="utf-8")
          
          g = gradle_path.read_text(encoding="utf-8")
          if "versionCode 23" not in g or 'versionName "2.2"' not in g:
              raise SystemExit("v2.2 version fields were not found before v2.2.1 bump.")
          g = g.replace("versionCode 23", "versionCode 24", 1)
          g = g.replace('versionName "2.2"', 'versionName "2.2.1"', 1)
          gradle_path.write_text(g, encoding="utf-8")
          
          print("BOSS XI v2.2.1 modern profile and realistic portrait overhaul applied.")
          PY

      - name: Verify v2.2.1 feature pack
        shell: bash
        run: |
          grep -q 'private void showFinances()' app/src/main/java/com/projectmister/game/MainActivity.java
          grep -q 'private void showStadiumCentre()' app/src/main/java/com/projectmister/game/MainActivity.java
          grep -q 'isLiveSubstitutionReversal' app/src/main/java/com/projectmister/game/MainActivity.java
          grep -q 'Cond ' app/src/main/java/com/projectmister/game/MainActivity.java
          grep -q 'private void initLiveAudio()' app/src/main/java/com/projectmister/game/MainActivity.java
          grep -q 'private class RealisticHumanPortraitView' app/src/main/java/com/projectmister/game/MainActivity.java
          grep -q 'private void showStaffProfile(String role)' app/src/main/java/com/projectmister/game/MainActivity.java
          grep -q 'PLAYER ATTRIBUTES • 1–20' app/src/main/java/com/projectmister/game/MainActivity.java
          grep -q 'versionName "2.2.1"' app/build.gradle
          test -f app/src/main/res/raw/boss_crowd_ambience.wav
          test -f app/src/main/res/raw/boss_kick.wav
          test -f app/src/main/res/raw/boss_whistle.wav
          test -f app/src/main/res/raw/boss_goal_cheer.wav
          test -f app/src/main/res/raw/boss_save_gasp.wav
          echo "BOSS XI v2.2.1 feature sanity checks passed."

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Android startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.projectmister.game
            adb shell am start -n com.projectmister.game/.MainActivity
            sleep 15
            adb shell pidof com.projectmister.game | grep -Eq '[0-9]+' || (echo "BOSS XI process died during startup."; adb logcat -d | grep -E "FATAL EXCEPTION|AndroidRuntime|BOSSXI|com.projectmister.game" | tail -n 250 || true; exit 1)
            ! (adb logcat -d | grep -A 80 "FATAL EXCEPTION" | grep -q "com.projectmister.game") || (echo "BOSS XI logged a fatal startup exception."; adb logcat -d | grep -E "FATAL EXCEPTION|AndroidRuntime|BOSSXI|com.projectmister.game" | tail -n 250 || true; exit 1)
            adb shell dumpsys activity activities | grep -q "com.projectmister.game/.MainActivity" || (echo "BOSS XI process is alive but MainActivity is not present."; adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity|com.projectmister.game" | head -n 80 || true; exit 1)
            echo "BOSS XI startup smoke test passed."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BOSS-XI-v2.2.1-profile-overhaul-hotfix1-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
