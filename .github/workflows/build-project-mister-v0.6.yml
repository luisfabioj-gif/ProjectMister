              private String statBar(int value) {
                  int blocks = Math.max(1, Math.min(10, value / 10));
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < 10; i++) sb.append(i < blocks ? "■" : "□");
                  return sb.toString();
              }
          
