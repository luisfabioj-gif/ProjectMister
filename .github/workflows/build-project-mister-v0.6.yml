                                          + "\nReferee strictness: " + liveRefereeStrictness + "/20"
                                          + "\nFormation: " + liveFormation
                                          + "\nMentality: " + liveMentality
                                          + "\nPassing: " + passingInstruction
                                          + "\nPressing: " + (pressingInstruction ? "Yes" : "No")
