                          text
                  );
                  identity.addView(info);
                  page.addView(identity);
          
                  page.addView(makeAccentButton("⚽  Watch Next Match Live", v -> startLiveMatchday()));
                  page.addView(makeButton("📰  Inbox / News", v -> showInbox()));
                  page.addView(makeButton("🔎  Scouting Centre", v -> showScoutCentre()));
                  page.addView(makeButton("🏢  Board & Media", v -> showClubOffice()));
                  page.addView(makeButton("🧠  Tactics", v -> showTactics()));
                  page.addView(makeButton("👥  Squad & Player Profiles", v -> showTeamPlayers(selectedClub)));
                  page.addView(makeButton("🌍  All Teams / Player Database", v -> showAllTeamsPlayers()));
                  page.addView(makeButton("🔄  Transfers & Offers", v -> showTransferHub()));
                  page.addView(makeButton("🏃  Training", v -> showTraining()));
                  page.addView(makeButton("📅  Calendar & Competitions", v -> showCompetitionCalendar()));
                  page.addView(makeButton("🏆  League Table", v -> showLeagueTable()));
              }
          
              private void startLiveMatchday() {
                  int opponent = leagueOpponentForRound(matchday);
                  boolean selectedHome = selectedHomeForRound(matchday);
                  liveHome = selectedHome ? selectedClub : opponent;
                  liveAway = selectedHome ? opponent : selectedClub;
          
                  ArrayList<Integer> remaining = new ArrayList<>();
                  for (int i = 0; i < clubNames.length; i++) {
                      if (i != liveHome && i != liveAway) remaining.add(i);
                  }
                  Collections.shuffle(remaining, new Random(9000L + matchday));
                  liveOtherFixtures.clear();
                  for (int i = 0; i + 1 < remaining.size(); i += 2) {
                      liveOtherFixtures.add(new int[]{remaining.get(i), remaining.get(i + 1)});
                  }
          
                  liveHomeGoals = 0;
                  liveAwayGoals = 0;
                  liveHomeShots = 0;
                  liveAwayShots = 0;
                  liveHomeOnTarget = 0;
                  liveAwayOnTarget = 0;
                  liveHomeCorners = 0;
                  liveAwayCorners = 0;
                  liveHomePossession = 50;
                  liveAwayPossession = 50;
                  liveMinuteFloat = 0f;
                  liveMinute = 0;
                  liveSpeed = 1;
                  livePaused = false;
                  liveMentality = styleToMentality(playStyle);
                  liveFormation = tacticFormation;
                  liveWeather = randomWeather();
                  liveRefereeStrictness = 6 + random.nextInt(10);
                  liveHomeFouls = 0;
                  liveAwayFouls = 0;
                  liveHomeYellows = 0;
                  liveAwayYellows = 0;
                  liveCommentaryHistory.clear();
