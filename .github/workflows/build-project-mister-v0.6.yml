              private void finishLiveMatch() {
                  if (!liveMatchActive) return;
                  stopLiveMatchTicker();
                  liveMinute = 90;
          
                  if (matchday >= 0 && matchday < clubMatchGF.length) {
                      if (liveHome == selectedClub) {
                          clubMatchGF[matchday] = liveHomeGoals;
                          clubMatchGA[matchday] = liveAwayGoals;
                      } else {
                          clubMatchGF[matchday] = liveAwayGoals;
                          clubMatchGA[matchday] = liveHomeGoals;
                      }
                  }
          
                  updateTable(liveHome, liveAway, liveHomeGoals, liveAwayGoals);
          
                  StringBuilder results = new StringBuilder();
                  results.append(clubNames[liveHome]).append("  ").append(liveHomeGoals)
                          .append(" - ").append(liveAwayGoals).append("  ").append(clubNames[liveAway]).append("\n\n");
          
                  for (int[] fixture : liveOtherFixtures) {
                      int home = fixture[0];
                      int away = fixture[1];
                      int homeGoals = simulateGoals(home, away, true);
                      int awayGoals = simulateGoals(away, home, false);
                      updateTable(home, away, homeGoals, awayGoals);
                      results.append(clubNames[home]).append("  ").append(homeGoals)
                              .append(" - ").append(awayGoals).append("  ").append(clubNames[away]).append("\n\n");
                  }
          
                  updatePlayerMatchStats();
                  applyTrainingSession();
                  updateBoardAfterMatch();
                  addNews("MATCH", "Full-time: " + clubNames[liveHome] + " " + liveHomeGoals + "-" + liveAwayGoals + " " + clubNames[liveAway],
                          "Possession " + liveHomePossession + "-" + liveAwayPossession + " • Shots " + liveHomeShots + "-" + liveAwayShots);
                  matchday++;
                  processScoutingAssignments();
                  processInjuriesAndRecovery();
                  if (matchday == 34) processSeasonEnd();
                  LocalDate playedDate = currentDate;
                  currentDate = currentDate.plusDays(7);
                  saveCurrentGame();
                  backAction = () -> showDashboard();
          
                  LinearLayout page = createPage(
                          "Full Time",
                          "Matchday " + matchday + " • " + playedDate.format(DATE_FORMAT),
                          true
                  );
          
                  TextView mainResult = makeText(
                          clubNames[liveHome] + "  " + liveHomeGoals + " - " + liveAwayGoals + "  " + clubNames[liveAway],
                          22,
                          accent
                  );
                  mainResult.setTypeface(Typeface.DEFAULT_BOLD);
                  mainResult.setPadding(0, 0, 0, dp(14));
                  page.addView(mainResult);
          
                  LinearLayout summary = makePanel();
                  summary.addView(makeText("MATCH SUMMARY", 13, accent));
                  summary.addView(makeText(
                          liveStatsSummary() + "\n\nFinal mentality: " + liveMentality
                                  + "\nFormation: " + liveFormation
                                  + "\nTraining completed: " + trainingFocus,
                          15,
                          text
                  ));
                  page.addView(summary);
          
                  TextView all = makeText("ALL RESULTS\n\n" + results, 15, text);
                  all.setBackground(rounded(panel));
                  all.setPadding(dp(16), dp(16), dp(16), dp(16));
                  page.addView(all);
          
                  page.addView(makeText("", 8, text));
                  page.addView(makeAccentButton("Continue", v -> showDashboard()));
                  page.addView(makeButton("League Table", v -> showLeagueTable()));
                  page.addView(makeButton("Player Database", v -> showAllTeamsPlayers()));
              }
          
              private class MatchPitchView extends View {
                  private final Paint pitchPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint linePaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint playerPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint outlinePaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint ballPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
          
                  private final float[] homeX = new float[11];
                  private final float[] homeY = new float[11];
                  private final float[] awayX = new float[11];
                  private final float[] awayY = new float[11];
                  private final float[] homeTargetX = new float[11];
                  private final float[] homeTargetY = new float[11];
                  private final float[] awayTargetX = new float[11];
                  private final float[] awayTargetY = new float[11];
          
                  private float ballX = 0.5f;
                  private float ballY = 0.5f;
                  private int animationFrame = 0;
                  private int carrier = 5;
                  private boolean homeHasBall = true;
          
                  MatchPitchView() {
                      super(MainActivity.this);
                      pitchPaint.setColor(Color.rgb(39, 146, 55));
                      linePaint.setColor(Color.argb(220, 245, 245, 245));
                      linePaint.setStyle(Paint.Style.STROKE);
                      linePaint.setStrokeWidth(dp(2));
                      outlinePaint.setStyle(Paint.Style.STROKE);
                      outlinePaint.setStrokeWidth(dp(2));
                      outlinePaint.setColor(Color.WHITE);
                      ballPaint.setColor(Color.WHITE);
          
                      float[][] homeBase = {
                              {0.08f,0.50f},
                              {0.22f,0.16f},{0.20f,0.38f},{0.20f,0.62f},{0.22f,0.84f},
                              {0.42f,0.25f},{0.40f,0.50f},{0.42f,0.75f},
                              {0.65f,0.18f},{0.69f,0.50f},{0.65f,0.82f}
                      };
                      float[][] awayBase = {
                              {0.92f,0.50f},
                              {0.78f,0.16f},{0.80f,0.38f},{0.80f,0.62f},{0.78f,0.84f},
                              {0.58f,0.25f},{0.60f,0.50f},{0.58f,0.75f},
                              {0.35f,0.18f},{0.31f,0.50f},{0.35f,0.82f}
                      };
          
                      for (int i = 0; i < 11; i++) {
                          homeX[i] = homeTargetX[i] = homeBase[i][0];
                          homeY[i] = homeTargetY[i] = homeBase[i][1];
                          awayX[i] = awayTargetX[i] = awayBase[i][0];
                          awayY[i] = awayTargetY[i] = awayBase[i][1];
                      }
                  }
          
                  void stepSimulation() {
                      if (livePaused) return;
                      animationFrame++;
          
                      if (animationFrame % 12 == 0) {
                          homeHasBall = random.nextInt(100) < liveHomePossession;
                          carrier = 1 + random.nextInt(10);
          
                          for (int i = 1; i < 11; i++) {
                              float homeDirection = homeHasBall ? 0.025f : -0.010f;
                              float awayDirection = homeHasBall ? 0.010f : -0.025f;
          
                              homeTargetX[i] = clamp(homeX[i] + homeDirection + (random.nextFloat() - 0.5f) * 0.10f, 0.08f, 0.92f);
                              homeTargetY[i] = clamp(homeY[i] + (random.nextFloat() - 0.5f) * 0.12f, 0.07f, 0.93f);
          
                              awayTargetX[i] = clamp(awayX[i] + awayDirection + (random.nextFloat() - 0.5f) * 0.10f, 0.08f, 0.92f);
                              awayTargetY[i] = clamp(awayY[i] + (random.nextFloat() - 0.5f) * 0.12f, 0.07f, 0.93f);
                          }
                      }
          
                      float easing = 0.10f;
                      for (int i = 1; i < 11; i++) {
                          homeX[i] += (homeTargetX[i] - homeX[i]) * easing;
                          homeY[i] += (homeTargetY[i] - homeY[i]) * easing;
                          awayX[i] += (awayTargetX[i] - awayX[i]) * easing;
                          awayY[i] += (awayTargetY[i] - awayY[i]) * easing;
                      }
          
                      float targetBallX = homeHasBall ? homeX[carrier] : awayX[carrier];
                      float targetBallY = homeHasBall ? homeY[carrier] : awayY[carrier];
                      ballX += (targetBallX - ballX) * 0.16f;
                      ballY += (targetBallY - ballY) * 0.16f;
                  }
          
                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      int w = getWidth();
                      int h = getHeight();
          
                      canvas.drawRect(0, 0, w, h, pitchPaint);
          
                      Paint stripe = new Paint();
                      stripe.setColor(Color.argb(32, 255, 255, 255));
                      int stripeW = w / 8;
                      for (int i = 0; i < 8; i += 2) {
                          canvas.drawRect(i * stripeW, 0, (i + 1) * stripeW, h, stripe);
                      }
          
                      float m = dp(14);
                      RectF field = new RectF(m, m, w - m, h - m);
                      canvas.drawRect(field, linePaint);
          
                      float midX = w / 2f;
                      canvas.drawLine(midX, m, midX, h - m, linePaint);
                      canvas.drawCircle(midX, h / 2f, Math.min(w, h) * 0.12f, linePaint);
          
                      float boxW = w * 0.16f;
                      float boxH = h * 0.42f;
                      canvas.drawRect(m, (h - boxH) / 2f, m + boxW, (h + boxH) / 2f, linePaint);
                      canvas.drawRect(w - m - boxW, (h - boxH) / 2f, w - m, (h + boxH) / 2f, linePaint);
          
                      float smallW = w * 0.07f;
                      float smallH = h * 0.22f;
                      canvas.drawRect(m, (h - smallH) / 2f, m + smallW, (h + smallH) / 2f, linePaint);
                      canvas.drawRect(w - m - smallW, (h - smallH) / 2f, w - m, (h + smallH) / 2f, linePaint);
          
                      float radius = Math.max(dp(6), Math.min(w, h) * 0.018f);
          
                      for (int i = 0; i < 11; i++) {
                          playerPaint.setColor(primaryColours[liveHome]);
                          canvas.drawCircle(homeX[i] * w, homeY[i] * h, radius, playerPaint);
                          canvas.drawCircle(homeX[i] * w, homeY[i] * h, radius, outlinePaint);
                      }
          
                      for (int i = 0; i < 11; i++) {
                          playerPaint.setColor(primaryColours[liveAway]);
                          canvas.drawCircle(awayX[i] * w, awayY[i] * h, radius, playerPaint);
                          canvas.drawCircle(awayX[i] * w, awayY[i] * h, radius, outlinePaint);
                      }
          
                      float ballRadius = Math.max(dp(4), radius * 0.55f);
                      canvas.drawCircle(ballX * w, ballY * h, ballRadius, ballPaint);
                      Paint ballOutline = new Paint(Paint.ANTI_ALIAS_FLAG);
                      ballOutline.setColor(Color.BLACK);
                      ballOutline.setStyle(Paint.Style.STROKE);
                      ballOutline.setStrokeWidth(dp(1));
                      canvas.drawCircle(ballX * w, ballY * h, ballRadius, ballOutline);
                  }
          
                  private float clamp(float value, float min, float max) {
                      return Math.max(min, Math.min(max, value));
                  }
              }
          
              private int simulateGoals(int attackingTeam, int defendingTeam, boolean home) {
                  int goals = random.nextInt(3);
                  int difference = strength[attackingTeam] - strength[defendingTeam];
                  if (difference >= 8 && random.nextDouble() < 0.55) goals++;
                  if (difference >= 15 && random.nextDouble() < 0.35) goals++;
                  if (difference <= -10 && goals > 0 && random.nextDouble() < 0.35) goals--;
                  if (home && random.nextDouble() < 0.18) goals++;
                  return Math.min(goals, 6);
              }
          
              private void updateTable(int home, int away, int homeGoals, int awayGoals) {
                  played[home]++;
                  played[away]++;
                  goalsFor[home] += homeGoals;
                  goalsAgainst[home] += awayGoals;
                  goalsFor[away] += awayGoals;
                  goalsAgainst[away] += homeGoals;
          
                  if (homeGoals > awayGoals) {
                      won[home]++;
                      lost[away]++;
                      points[home] += 3;
                  } else if (awayGoals > homeGoals) {
                      won[away]++;
                      lost[home]++;
                      points[away] += 3;
                  } else {
                      drawn[home]++;
                      drawn[away]++;
                      points[home]++;
                      points[away]++;
                  }
              }
          
              private void showLeagueTable() {
                  backAction = () -> showDashboard();
                  LinearLayout page = createPage("Liga Portugal", "Season 2026/27 • Matchday " + matchday, true);
          
                  Integer[] order = new Integer[clubNames.length];
                  for (int i = 0; i < clubNames.length; i++) order[i] = i;
          
                  Arrays.sort(order, new Comparator<Integer>() {
                      @Override
                      public int compare(Integer a, Integer b) {
                          if (points[a] != points[b]) return Integer.compare(points[b], points[a]);
                          int gdA = goalsFor[a] - goalsAgainst[a];
                          int gdB = goalsFor[b] - goalsAgainst[b];
                          if (gdA != gdB) return Integer.compare(gdB, gdA);
                          return Integer.compare(goalsFor[b], goalsFor[a]);
                      }
                  });
          
                  StringBuilder table = new StringBuilder();
                  table.append(" #  CLUB   P   W  D  L   GD  PTS\n");
                  table.append("--------------------------------\n");
          
                  for (int position = 0; position < order.length; position++) {
                      int club = order[position];
                      int gd = goalsFor[club] - goalsAgainst[club];
                      table.append(String.format(
                              Locale.UK,
                              "%2d  %-4s  %2d  %2d %2d %2d  %+3d  %3d",
                              position + 1, shortNames[club], played[club], won[club], drawn[club], lost[club], gd, points[club]
                      ));
                      if (club == selectedClub) table.append("  ◀");
                      table.append("\n");
                  }
          
                  TextView standings = makeText(table.toString(), 14, text);
                  standings.setTypeface(Typeface.MONOSPACE);
                  standings.setBackground(rounded(panel));
                  standings.setPadding(dp(12), dp(16), dp(12), dp(16));
                  page.addView(standings);
                  page.addView(makeText("", 8, text));
                  page.addView(makeButton("Back to Dashboard", v -> showDashboard()));
              }
          
