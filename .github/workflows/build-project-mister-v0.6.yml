                  liveCommentaryHistory.add(liveCommentary);
                  liveFrameCounter = 0;
                  liveSubsUsed = 0;
                  liveUsedOffIds.clear();
                  prepareLiveLineup();
          
                  showLiveMatch();
              }
          
