                                  + "Board confidence  " + boardConfidence + "%\n"
                                  + "Manager rep       " + managerReputation + "/100\n"
                                  + "Transfer window   " + transferWindowStatus(currentDate) + "\n"
                                  + "Europe            " + europeanCompetitionForClub(selectedClub),
