              private int positionRank(String position) {
                  switch (position) {
                      case "GK": return 0;
                      case "RB": return 1;
                      case "CB": return 2;
                      case "LB": return 3;
                      case "DM": return 4;
                      case "CM": return 5;
                      case "AM": return 6;
                      case "RM": return 7;
                      case "LM": return 8;
                      case "RW": return 9;
                      case "LW": return 10;
                      case "ST": return 11;
                      default: return 12;
                  }
              }
          
              private void sortPlayersByPositionThenOverall(ArrayList<Player> list) {
                  Collections.sort(list, (a, b) -> {
                      int ra = positionRank(a.position);
                      int rb = positionRank(b.position);
                      if (ra != rb) return Integer.compare(ra, rb);
                      return Integer.compare(b.overall, a.overall);
                  });
              }
          
