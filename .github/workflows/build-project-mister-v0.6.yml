              private void setLiveSpeed(int speed) {
                  liveSpeed = speed;
                  refreshLiveHeader();
              }
          
              private void startLiveMatchTicker() {
                  matchRunnable = new Runnable() {
                      @Override
                      public void run() {
                          if (!liveMatchActive) return;
          
                          if (!livePaused) {
                              liveMinuteFloat = Math.min(90f, liveMinuteFloat + (0.033f * liveSpeed));
                              int newMinute = (int) liveMinuteFloat;
          
                              while (liveMinute < newMinute && liveMinute < 90) {
                                  liveMinute++;
                                  processLiveMinute(liveMinute);
                              }
          
                              if (livePitchView != null) {
                                  livePitchView.stepSimulation();
                                  livePitchView.postInvalidateOnAnimation();
                              }
          
                              liveFrameCounter++;
                              if (liveFrameCounter % 3 == 0 || liveMinuteFloat >= 90f) {
                                  refreshLiveHeader();
                              }
          
                              if (liveMinuteFloat >= 90f) {
                                  finishLiveMatch();
                                  return;
                              }
                          }
          
                          matchHandler.postDelayed(this, 33);
                      }
                  };
                  matchHandler.post(matchRunnable);
              }
          
              private void stopLiveMatchTicker() {
                  liveMatchActive = false;
                  if (matchRunnable != null) matchHandler.removeCallbacks(matchRunnable);
                  matchRunnable = null;
              }
          
              private void processLiveMinute(int minute) {
                  double homeQuality = effectiveTeamQuality(liveHome, true);
                  double awayQuality = effectiveTeamQuality(liveAway, true);
                  int basePossession = 50 + (int)Math.round((homeQuality - awayQuality) / 4.0);
          
                  if (selectedClub == liveHome) basePossession += possessionTacticModifier();
                  if (selectedClub == liveAway) basePossession -= possessionTacticModifier();
          
                  liveHomePossession = Math.max(32, Math.min(68, basePossession + random.nextInt(7) - 3));
                  liveAwayPossession = 100 - liveHomePossession;
          
                  if (minute == 45) {
                      recordCommentary("Half-time. The managers can now adjust tactics or make substitutions.");
                      return;
                  }
          
                  double foulChance = 0.028 + (liveRefereeStrictness - 8) * 0.002;
                  if (selectedClub == liveHome || selectedClub == liveAway) {
                      if ("Hard".equals(tacklingInstruction)) foulChance += 0.018;
                      if ("Easy".equals(tacklingInstruction)) foulChance -= 0.010;
                  }
                  if (random.nextDouble() < Math.max(0.01, foulChance)) {
                      int foulTeam = random.nextInt(100) < liveHomePossession ? liveAway : liveHome;
                      if (foulTeam == liveHome) liveHomeFouls++; else liveAwayFouls++;
                      String offender = randomPlayerName(foulTeam, false);
                      boolean yellow = random.nextDouble() < (0.10 + liveRefereeStrictness * 0.025);
                      if (yellow) {
                          if (foulTeam == liveHome) liveHomeYellows++; else liveAwayYellows++;
                          recordCommentary("YELLOW CARD: " + offender + " goes into the referee's notebook.");
                      } else {
                          recordCommentary(offender + " is penalised for a foul.");
                      }
                      return;
                  }
          
                  double eventChance = 0.12;
                  if (minute > 75) eventChance += 0.035;
                  if (pressingInstruction && (selectedClub == liveHome || selectedClub == liveAway)) eventChance += 0.008;
                  if ("Wet".equals(liveWeather) || "Heavy Rain".equals(liveWeather)) eventChance += 0.008;
          
                  if (random.nextDouble() > eventChance) {
                      if (random.nextDouble() < 0.20) {
                          int team = random.nextInt(100) < liveHomePossession ? liveHome : liveAway;
                          recordCommentary(randomPlayerName(team, false) + " keeps possession for " + clubNames[team] + ".");
                      }
                      return;
                  }
          
                  int attacking = random.nextInt(100) < liveHomePossession ? liveHome : liveAway;
                  int defending = attacking == liveHome ? liveAway : liveHome;
          
                  double attackQuality = effectiveTeamQuality(attacking, true);
                  double defenceQuality = effectiveTeamQuality(defending, false);
                  double qualityEdge = (attackQuality - defenceQuality) / 100.0;
                  double mentalityBoost = 0.0;
                  if (attacking == selectedClub && liveMentality.equals("Attacking")) mentalityBoost += 0.045;
                  if (attacking == selectedClub && liveMentality.equals("Defensive")) mentalityBoost -= 0.025;
                  if (attacking == selectedClub && counterAttackInstruction && liveHomePossession < 48) mentalityBoost += 0.035;
                  if (attacking == selectedClub && "Central Overload".equals(wibWobShape)) mentalityBoost += 0.018;
          
                  if (attacking == liveHome) liveHomeShots++; else liveAwayShots++;
          
                  Player attackerPlayer = randomPlayerForTeam(attacking, true);
                  String attacker = attackerPlayer == null ? clubNames[attacking] + " player" : attackerPlayer.name;
                  double playerFinish = attackerPlayer == null ? 0.0 : (attackerPlayer.finishing - 65) / 300.0;
                  double pressureModifier = attackerPlayer == null ? 0.0 : (attackerPlayer.pressure - 10) / 350.0;
                  double consistencyNoise = attackerPlayer == null ? 0.0 : ((attackerPlayer.consistency - 10) / 250.0);
                  double weatherPenalty = ("Windy".equals(liveWeather) || "Heavy Rain".equals(liveWeather)) ? -0.035 : 0.0;
          
                  double onTargetChance = 0.41 + qualityEdge * 0.22 + mentalityBoost + playerFinish + consistencyNoise + weatherPenalty;
                  onTargetChance = Math.max(0.20, Math.min(0.72, onTargetChance));
          
                  if (random.nextDouble() < onTargetChance) {
                      if (attacking == liveHome) liveHomeOnTarget++; else liveAwayOnTarget++;
          
                      double goalChance = 0.18 + qualityEdge * 0.14 + mentalityBoost + playerFinish + pressureModifier;
                      if (attackerPlayer != null && minute > 75) goalChance += (attackerPlayer.importantMatches - 10) / 350.0;
                      goalChance = Math.max(0.07, Math.min(0.46, goalChance));
          
                      if (random.nextDouble() < goalChance) {
                          if (attacking == liveHome) liveHomeGoals++; else liveAwayGoals++;
                          recordCommentary("GOAL! " + attacker + " scores for " + clubNames[attacking] + "!");
                          awardLiveGoal(attacking, attacker);
                      } else {
                          recordCommentary(attacker + " shoots on target — the goalkeeper makes the save.");
                      }
                  } else {
                      if (random.nextDouble() < 0.22) {
                          if (attacking == liveHome) liveHomeCorners++; else liveAwayCorners++;
                          recordCommentary(attacker + " forces a corner for " + clubNames[attacking] + ".");
                      } else {
                          String[] misses = {
                                  "fires just wide.",
                                  "drives the effort over the bar.",
                                  "sees the shot blocked.",
                                  "tries from distance but misses the target."
                          };
                          recordCommentary(attacker + " " + misses[random.nextInt(misses.length)]);
                      }
                  }
          
                  if (("Wet".equals(liveWeather) || "Heavy Rain".equals(liveWeather)) && random.nextDouble() < 0.006) {
                      Player knock = randomPlayerForTeam(random.nextBoolean() ? liveHome : liveAway, false);
                      if (knock != null) {
                          knock.fitness = Math.max(45, knock.fitness - 12);
                          recordCommentary(knock.name + " looks uncomfortable after a heavy challenge.");
                      }
                  }
              }
          
              private void recordCommentary(String line) {
                  liveCommentary = line;
                  liveCommentaryHistory.add(liveMinute + "'  " + line);
                  while (liveCommentaryHistory.size() > 14) liveCommentaryHistory.remove(0);
              }
          
              private Player randomPlayerForTeam(int team, boolean attacking) {
                  ArrayList<Player> choices = new ArrayList<>();
                  if (liveMatchActive && team == selectedClub && !liveXIIds.isEmpty()) {
                      for (int id : liveXIIds) {
                          Player p = findPlayer(id);
                          if (p != null && (!attacking || isAttackingPosition(p.position))) choices.add(p);
                      }
                      if (choices.isEmpty()) {
                          for (int id : liveXIIds) {
                              Player p = findPlayer(id);
                              if (p != null) choices.add(p);
                          }
                      }
                  } else {
                      for (Player p : players) {
                          if (p.team == team && (!attacking || isAttackingPosition(p.position))) choices.add(p);
                      }
                  }
                  if (choices.isEmpty()) return null;
                  return choices.get(random.nextInt(choices.size()));
              }
          
              private double effectiveTeamQuality(int team, boolean attacking) {
                  double total = 0.0;
                  int count = 0;
                  for (Player p : players) {
                      if (p.team != team) continue;
                      if (team == selectedClub && liveMatchActive && !liveXIIds.isEmpty() && !liveXIIds.contains(p.id)) continue;
                      double core = p.overall;
                      core += (p.morale - 75) * 0.05;
                      core += (p.fitness - 85) * 0.04;
                      core += (p.consistency - 10) * 0.18;
                      if (attacking) core += (p.passing + p.technique + p.finishing - 210) * 0.025;
                      else core += (p.defending + p.physical + p.passing - 210) * 0.022;
                      total += core;
                      count++;
                  }
                  if (count == 0) return strength[team];
                  double q = total / count;
                  if (team == selectedClub) {
                      if (pressingInstruction) q += 0.8;
                      if (offsideTrapInstruction && !attacking) q += 0.5;
                      if (menBehindBallInstruction && !attacking) q += 1.2;
                      if ("Short".equals(passingInstruction) && attacking) q += 0.6;
                      if ("Direct".equals(passingInstruction) && attacking) q += 0.35;
                  }
                  return q;
              }
          
              private int possessionTacticModifier() {
                  int mod = 0;
                  if ("Short".equals(passingInstruction)) mod += 3;
                  if ("Long".equals(passingInstruction)) mod -= 2;
                  if (pressingInstruction) mod += 1;
                  if (menBehindBallInstruction) mod -= 3;
                  if ("Wide".equals(wibWobShape)) mod += 1;
                  return mod;
              }
          
              private String randomWeather() {
                  String[] weather = {"Dry", "Dry", "Cloudy", "Wet", "Windy", "Heavy Rain"};
                  return weather[random.nextInt(weather.length)];
              }
          
              private String randomPlayerName(int team, boolean attacking) {
                  ArrayList<Player> choices = new ArrayList<>();
          
                  if (liveMatchActive && team == selectedClub && !liveXIIds.isEmpty()) {
                      for (int id : liveXIIds) {
                          Player p = findPlayer(id);
                          if (p == null) continue;
                          if (!attacking || isAttackingPosition(p.position)) choices.add(p);
                      }
                      if (choices.isEmpty()) {
                          for (int id : liveXIIds) {
                              Player p = findPlayer(id);
                              if (p != null) choices.add(p);
                          }
                      }
                  } else {
                      for (Player p : players) {
                          if (p.team != team) continue;
                          if (!attacking || isAttackingPosition(p.position)) choices.add(p);
                      }
                  }
          
                  if (choices.isEmpty()) return clubNames[team] + " player";
                  return choices.get(random.nextInt(choices.size())).name;
              }
          
              private boolean isAttackingPosition(String position) {
                  return position.equals("ST") || position.equals("RW") || position.equals("LW")
                          || position.equals("AM") || position.equals("CM") || position.equals("RM")
                          || position.equals("LM");
              }
          
              private void awardLiveGoal(int team, String scorerName) {
                  for (Player p : players) {
                      if (p.team == team && p.name.equals(scorerName)) {
                          p.goals++;
                          p.morale = Math.min(100, p.morale + 3);
                          break;
                      }
                  }
              }
          
              private void refreshLiveHeader() {
                  if (liveScoreText != null) liveScoreText.setText(liveHomeGoals + "  -  " + liveAwayGoals);
          
                  String half = liveMinute < 45 ? "1st Half" : liveMinute < 90 ? "2nd Half" : "FT";
                  if (liveClockText != null) {
                      liveClockText.setText(liveMinute + "'  •  " + half + "  •  x" + liveSpeed
                              + (livePaused ? "  •  PAUSED" : ""));
                  }
          
                  if (liveCommentaryText != null) liveCommentaryText.setText(liveCommentary);
                  if (liveStatsText != null) liveStatsText.setText(liveStatsSummary());
              }
          
              private String liveStatsSummary() {
                  return "Possession     " + liveHomePossession + "%   " + liveAwayPossession + "%\n"
                          + "Shots          " + liveHomeShots + "       " + liveAwayShots + "\n"
                          + "On target      " + liveHomeOnTarget + "       " + liveAwayOnTarget + "\n"
                          + "Corners        " + liveHomeCorners + "       " + liveAwayCorners + "\n"
                          + "Fouls          " + liveHomeFouls + "       " + liveAwayFouls + "\n"
                          + "Yellow cards   " + liveHomeYellows + "       " + liveAwayYellows;
              }
          
