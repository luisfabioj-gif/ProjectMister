name: Build BOSS XI APK v2.1.1 Startup Fix (Hotfix 3)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-boss-xi-v2.1.1.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Recreate original BOSS XI v2.1 source
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin eb11125cf791299ec35342cf8cca1ad383fb7f54
          git show eb11125cf791299ec35342cf8cca1ad383fb7f54:.github/workflows/build-boss-xi-v2.1.yml > /tmp/original-v2.1.yml

          python3 <<'PY'
          from pathlib import Path

          source = Path("/tmp/original-v2.1.yml").read_text(encoding="utf-8").splitlines()

          start = next(
              i for i, line in enumerate(source)
              if line.strip() == "- name: Create BOSS XI v2.1"
          )
          run_line = next(
              i for i in range(start + 1, len(source))
              if source[i].strip() == "run: |"
          )

          script = []
          for line in source[run_line + 1:]:
              if line.startswith("      - name:"):
                  break
              if line.startswith("          "):
                  script.append(line[10:])
              elif not line.strip():
                  script.append("")
              else:
                  raise SystemExit(
                      "Unexpected indentation in original v2.1 workflow: "
                      + repr(line[:100])
                  )

          if not script:
              raise SystemExit("Could not recover the v2.1 source generator.")

          Path("/tmp/create-v2.1.sh").write_text(
              "\n".join(script) + "\n",
              encoding="utf-8"
          )
          print(f"Recovered {len(script)} lines from BOSS XI v2.1.")
          PY

          bash /tmp/create-v2.1.sh

      - name: Apply minimal v2.1.1 startup hotfix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          java_file = Path("app/src/main/java/com/projectmister/game/MainActivity.java")
          gradle_file = Path("app/build.gradle")

          java = java_file.read_text(encoding="utf-8")

          early_call = """                  enableImmersiveNavigation();
                  prefs = getSharedPreferences("project_mister", MODE_PRIVATE);"""

          early_fixed = """                  prefs = getSharedPreferences("project_mister", MODE_PRIVATE);"""

          if early_call not in java:
              raise SystemExit("Could not find the v2.1 early immersive-navigation startup call.")

          java = java.replace(early_call, early_fixed, 1)

          focus_call = """              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) enableImmersiveNavigation();
              }"""

          focus_fixed = """              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  // v2.1.1 startup hotfix:
                  // leave Android system navigation unchanged until the
                  // device-specific crash is fully isolated.
              }"""

          if focus_call not in java:
              raise SystemExit("Could not find the v2.1 window-focus immersive-navigation call.")

          java = java.replace(focus_call, focus_fixed, 1)

          java = java.replace(
              "Three career saves • BOSS XI v1.7 • Live Engine Fix",
              "Three career saves • BOSS XI v2.1.1 • Startup Fix",
              1
          )

          java_file.write_text(java, encoding="utf-8")

          gradle = gradle_file.read_text(encoding="utf-8")
          if "versionCode 21" not in gradle:
              raise SystemExit("versionCode 21 was not found.")
          if 'versionName "2.1"' not in gradle:
              raise SystemExit('versionName "2.1" was not found.')

          gradle = gradle.replace("versionCode 21", "versionCode 22", 1)
          gradle = gradle.replace('versionName "2.1"', 'versionName "2.1.1"', 1)
          gradle_file.write_text(gradle, encoding="utf-8")

          print("Minimal v2.1.1 startup hotfix applied successfully.")
          PY

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Android startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.projectmister.game
            adb shell am start -W -n com.projectmister.game/.MainActivity
            sleep 8

            PID=$(adb shell pidof com.projectmister.game | tr -d '\r')

            if [ -z "$PID" ]; then
              echo "BOSS XI process died during startup."
              adb logcat -d | grep -E "FATAL EXCEPTION|AndroidRuntime|BOSSXI|com.projectmister.game" | tail -n 250 || true
              exit 1
            fi

            if adb logcat -d | grep -A 60 "FATAL EXCEPTION" | grep -q "com.projectmister.game"; then
              echo "BOSS XI logged a fatal startup exception."
              adb logcat -d | grep -E "FATAL EXCEPTION|AndroidRuntime|BOSSXI|com.projectmister.game" | tail -n 250 || true
              exit 1
            fi

            echo "BOSS XI startup smoke test passed. PID=$PID"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BOSS-XI-v2.1.1-startup-fix-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
