name: Build BOSS XI APK v2.1.1 Startup Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-boss-xi-v2.1.1.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Recreate v2.1 source
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          workflow_path = Path(".github/workflows/build-boss-xi-v2.1.yml")
          if not workflow_path.exists():
              raise SystemExit(
                  "Original v2.1 workflow is missing: "
                  ".github/workflows/build-boss-xi-v2.1.yml"
              )

          lines = workflow_path.read_text(encoding="utf-8").splitlines()

          try:
              step_index = next(
                  i for i, line in enumerate(lines)
                  if line.strip() == "- name: Create BOSS XI v2.1"
              )
          except StopIteration:
              raise SystemExit("Could not find the 'Create BOSS XI v2.1' step.")

          try:
              run_index = next(
                  i for i in range(step_index + 1, len(lines))
                  if lines[i].strip() == "run: |"
              )
          except StopIteration:
              raise SystemExit("Could not find the v2.1 source-generation script.")

          script = []
          for line in lines[run_index + 1:]:
              if line.startswith("      - name:"):
                  break
              if line.startswith("          "):
                  script.append(line[10:])
              elif not line.strip():
                  script.append("")
              else:
                  raise SystemExit(
                      "Unexpected indentation while extracting v2.1 source: "
                      + repr(line[:80])
                  )

          if not script:
              raise SystemExit("The v2.1 source-generation script was empty.")

          out = Path("/tmp/create-boss-xi-v2.1.sh")
          out.write_text("\n".join(script) + "\n", encoding="utf-8")
          print(f"Extracted {len(script)} lines from the original v2.1 generator.")
          PY

          bash /tmp/create-boss-xi-v2.1.sh

      - name: Apply v2.1.1 startup fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          java_path = Path("app/src/main/java/com/projectmister/game/MainActivity.java")
          gradle_path = Path("app/build.gradle")

          if not java_path.exists():
              raise SystemExit(f"Generated Java source not found: {java_path}")
          if not gradle_path.exists():
              raise SystemExit(f"Generated Gradle file not found: {gradle_path}")

          s = java_path.read_text(encoding="utf-8")

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Patch target not found: {label}")
              return text.replace(old, new, 1)

          # Make SharedPreferences tolerant of values left by older builds.
          s = s.replace("prefs.getString(", "safePrefString(")
          s = s.replace("prefs.getInt(", "safePrefInt(")
          s = s.replace("prefs.getBoolean(", "safePrefBoolean(")

          old_key = '''    private String key(int slot, String field) {
              return "save_" + slot + "_" + field;
          }
          '''

          new_key = '''    private String key(int slot, String field) {
              return "save_" + slot + "_" + field;
          }

          // v2.1.1: tolerate preferences written by older BOSS XI builds.
          private Object rawPref(String prefKey) {
              try {
                  return prefs == null ? null : prefs.getAll().get(prefKey);
              } catch (Throwable ignored) {
                  return null;
              }
          }

          private String safePrefString(String prefKey, String fallback) {
              Object value = rawPref(prefKey);
              if (value == null) return fallback;
              return value instanceof String ? (String) value : String.valueOf(value);
          }

          private int safePrefInt(String prefKey, int fallback) {
              Object value = rawPref(prefKey);
              if (value instanceof Number) return ((Number) value).intValue();
              if (value instanceof Boolean) return ((Boolean) value) ? 1 : 0;
              if (value != null) {
                  try {
                      return Integer.parseInt(String.valueOf(value).trim());
                  } catch (NumberFormatException ignored) {
                  }
              }
              return fallback;
          }

          private boolean safePrefBoolean(String prefKey, boolean fallback) {
              Object value = rawPref(prefKey);
              if (value instanceof Boolean) return (Boolean) value;
              if (value instanceof Number) return ((Number) value).intValue() != 0;
              if (value != null) {
                  String stringValue = String.valueOf(value).trim();
                  if ("1".equals(stringValue) || "true".equalsIgnoreCase(stringValue)) return true;
                  if ("0".equals(stringValue) || "false".equalsIgnoreCase(stringValue)) return false;
              }
              return fallback;
          }
          '''

          s = replace_once(s, old_key, new_key, "safe preference helpers")

          old_startup = '''    @Override
          protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().setStatusBarColor(background);
              getWindow().setNavigationBarColor(background);
              enableImmersiveNavigation();
              prefs = getSharedPreferences("project_mister", MODE_PRIVATE);
              loadEditorData();
              generatePlayers();
              showMainMenu();
          }

          private void enableImmersiveNavigation() {
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                  WindowInsetsController controller = getWindow().getInsetsController();
                  if (controller != null) {
                      controller.hide(WindowInsets.Type.navigationBars());
                      controller.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                  }
              } else {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
              }
          }
          '''

          new_startup = '''    @Override
          protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              try {
                  getWindow().setStatusBarColor(background);
                  getWindow().setNavigationBarColor(background);
                  prefs = getSharedPreferences("project_mister", MODE_PRIVATE);
                  loadEditorData();
                  generatePlayers();
                  showMainMenu();

                  // Apply immersive navigation only after the first screen exists.
                  enableImmersiveNavigation();
              } catch (Throwable error) {
                  android.util.Log.e("BOSSXI", "Startup failure", error);
                  showStartupRecovery(error);
              }
          }

          private void showStartupRecovery(Throwable error) {
              try {
                  LinearLayout page = new LinearLayout(this);
                  page.setOrientation(LinearLayout.VERTICAL);
                  page.setPadding(dp(24), dp(36), dp(24), dp(24));
                  page.setBackgroundColor(background);

                  TextView title = new TextView(this);
                  title.setText("BOSS XI startup recovery");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(24);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  page.addView(title);

                  TextView message = new TextView(this);
                  String reason = error == null
                          ? "Unknown startup error"
                          : error.getClass().getSimpleName()
                                  + (error.getMessage() == null ? "" : ": " + error.getMessage());

                  message.setText(
                          "\\nThe game prevented a startup crash.\\n\\n"
                                  + reason
                                  + "\\n\\nTry Retry first. If the problem remains, "
                                  + "clear only BOSS XI local data and retry. "
                                  + "Take a screenshot of this screen if it appears again."
                  );
                  message.setTextColor(Color.WHITE);
                  message.setTextSize(16);
                  message.setPadding(0, dp(12), 0, dp(24));
                  page.addView(message);

                  Button retry = new Button(this);
                  retry.setText("Retry");
                  retry.setOnClickListener(v -> recreate());
                  page.addView(retry);

                  Button reset = new Button(this);
                  reset.setText("Clear local BOSS XI data and retry");
                  reset.setOnClickListener(v -> {
                      try {
                          if (prefs != null) prefs.edit().clear().commit();
                      } catch (Throwable ignored) {
                      }
                      recreate();
                  });
                  page.addView(reset);

                  setContentView(page);
              } catch (Throwable fallback) {
                  android.util.Log.e("BOSSXI", "Recovery screen failure", fallback);

                  TextView emergency = new TextView(this);
                  emergency.setText(
                          "BOSS XI could not start. Error: "
                                  + (error == null ? "unknown" : error.getClass().getSimpleName())
                  );
                  emergency.setTextColor(Color.WHITE);
                  emergency.setBackgroundColor(Color.BLACK);
                  emergency.setPadding(24, 24, 24, 24);
                  setContentView(emergency);
              }
          }

          private void enableImmersiveNavigation() {
              try {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      WindowInsetsController controller = getWindow().getInsetsController();
                      if (controller != null) {
                          controller.hide(WindowInsets.Type.navigationBars());
                          controller.setSystemBarsBehavior(
                                  WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          );
                      }
                  } else {
                      getWindow().getDecorView().setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      );
                  }
              } catch (Throwable error) {
                  android.util.Log.w("BOSSXI", "Immersive navigation unavailable", error);
              }
          }
          '''

          s = replace_once(s, old_startup, new_startup, "startup protection")

          old_orientation = '''        stopLiveMatchTicker();
              setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_PORTRAIT);
              ScrollView scroll = new ScrollView(this);'''

          new_orientation = '''        stopLiveMatchTicker();
              try {
                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_PORTRAIT);
              } catch (Throwable error) {
                  android.util.Log.w("BOSSXI", "Portrait request ignored", error);
              }
              ScrollView scroll = new ScrollView(this);'''

          s = replace_once(s, old_orientation, new_orientation, "portrait protection")

          old_preview = '''            int club = safePrefInt(key(slot, "club"), 0);
                  int md = safePrefInt(key(slot, "matchday"), 0);'''

          new_preview = '''            int club = safePrefInt(key(slot, "club"), 0);
                  if (club < 0 || club >= clubNames.length) club = 0;
                  int md = Math.max(0, Math.min(34, safePrefInt(key(slot, "matchday"), 0)));'''

          s = replace_once(s, old_preview, new_preview, "career preview bounds")

          old_load_start = '''    private void loadSave(int slot) {
              selectedSlot = slot;
              selectedClub = safePrefInt(key(slot, "club"), 0);
              managerFirstName = safePrefString(key(slot, "manager_first"), "");'''

          new_load_start = '''    private void loadSave(int slot) {
              selectedSlot = Math.max(0, Math.min(SAVE_SLOTS - 1, slot));
              selectedClub = safePrefInt(key(selectedSlot, "club"), 0);
              if (selectedClub < 0 || selectedClub >= clubNames.length) selectedClub = 0;
              managerFirstName = safePrefString(key(selectedSlot, "manager_first"), "");'''

          s = replace_once(s, old_load_start, new_load_start, "loadSave bounds")

          load_start = s.index("    private void loadSave(int slot) {")
          load_end = s.index("    private void confirmDeleteSave", load_start)
          load_block = s[load_start:load_end].replace("key(slot,", "key(selectedSlot,")

          load_block = load_block.replace(
              'managerCountryIndex = safePrefInt(key(selectedSlot, "manager_country_index"), 0);',
              'managerCountryIndex = safePrefInt(key(selectedSlot, "manager_country_index"), 0);\\n'
              '        if (managerCountryIndex < 0 || managerCountryIndex >= COUNTRY_OPTIONS.length) managerCountryIndex = 0;'
          )
          load_block = load_block.replace(
              'managerLeagueIndex = safePrefInt(key(selectedSlot, "manager_league_index"), 0);',
              'managerLeagueIndex = safePrefInt(key(selectedSlot, "manager_league_index"), 0);\\n'
              '        if (managerLeagueIndex < 0 || managerLeagueIndex >= LEAGUE_OPTIONS.length) managerLeagueIndex = 0;'
          )
          load_block = load_block.replace(
              'matchday = safePrefInt(key(selectedSlot, "matchday"), 0);',
              'matchday = Math.max(0, Math.min(34, safePrefInt(key(selectedSlot, "matchday"), 0)));'
          )

          s = s[:load_start] + load_block + s[load_end:]

          s = s.replace(
              "Three career saves • BOSS XI v1.7 • Live Engine Fix",
              "Three career saves • BOSS XI v2.1.1 • Startup Stability Fix",
              1
          )

          java_path.write_text(s, encoding="utf-8")

          g = gradle_path.read_text(encoding="utf-8")
          if "versionCode 21" not in g or 'versionName "2.1"' not in g:
              raise SystemExit("Could not locate the v2.1 version fields in app/build.gradle.")
          g = g.replace("versionCode 21", "versionCode 22", 1)
          g = g.replace('versionName "2.1"', 'versionName "2.1.1"', 1)
          gradle_path.write_text(g, encoding="utf-8")

          print("Applied BOSS XI v2.1.1 startup-stability patch.")
          PY

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Android startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.projectmister.game
            adb shell am start -W -n com.projectmister.game/.MainActivity
            sleep 6

            PID=$(adb shell pidof com.projectmister.game | tr -d '\r')
            if [ -z "$PID" ]; then
              echo "BOSS XI process died during startup."
              adb logcat -d | grep -E "FATAL EXCEPTION|AndroidRuntime|BOSSXI" | tail -n 200 || true
              exit 1
            fi

            if adb logcat -d | grep -A 40 "FATAL EXCEPTION" | grep -q "com.projectmister.game"; then
              echo "BOSS XI logged a fatal exception during startup."
              adb logcat -d | grep -E "FATAL EXCEPTION|AndroidRuntime|BOSSXI" | tail -n 200 || true
              exit 1
            fi

            echo "BOSS XI stayed alive after launch. PID=$PID"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BOSS-XI-v2.1.1-startup-fix-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
