name: Build BOSS XI APK v2.1.1 Startup Fix (Hotfix 2)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-boss-xi-v2.1.1.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Recreate v2.1 source from Git history
        shell: bash
        run: |
          # The original v2.1 workflow was deleted from main, but its complete
          # source generator is preserved in commit eb11125.
          git fetch --no-tags --depth=1 origin eb11125cf791299ec35342cf8cca1ad383fb7f54
          git show eb11125cf791299ec35342cf8cca1ad383fb7f54:.github/workflows/build-boss-xi-v2.1.yml > /tmp/build-boss-xi-v2.1.yml

          python3 <<'PY'
          from pathlib import Path

          workflow_path = Path("/tmp/build-boss-xi-v2.1.yml")
          lines = workflow_path.read_text(encoding="utf-8").splitlines()

          try:
              step_index = next(
                  i for i, line in enumerate(lines)
                  if line.strip() == "- name: Create BOSS XI v2.1"
              )
          except StopIteration:
              raise SystemExit("Could not find the 'Create BOSS XI v2.1' source step in Git history.")

          try:
              run_index = next(
                  i for i in range(step_index + 1, len(lines))
                  if lines[i].strip() == "run: |"
              )
          except StopIteration:
              raise SystemExit("Could not find the v2.1 source-generation script.")

          script = []
          for line in lines[run_index + 1:]:
              if line.startswith("      - name:"):
                  break
              if line.startswith("          "):
                  script.append(line[10:])
              elif not line.strip():
                  script.append("")
              else:
                  raise SystemExit(
                      "Unexpected indentation while extracting v2.1 source: "
                      + repr(line[:80])
                  )

          if not script:
              raise SystemExit("The v2.1 source-generation script was empty.")

          out = Path("/tmp/create-boss-xi-v2.1.sh")
          out.write_text("\n".join(script) + "\n", encoding="utf-8")
          print(f"Recovered {len(script)} lines from BOSS XI v2.1.")
          PY

          bash /tmp/create-boss-xi-v2.1.sh

      - name: Apply v2.1.1 startup fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          java_path = Path("app/src/main/java/com/projectmister/game/MainActivity.java")
          gradle_path = Path("app/build.gradle")

          if not java_path.exists():
              raise SystemExit(f"Generated Java source not found: {java_path}")
          if not gradle_path.exists():
              raise SystemExit(f"Generated Gradle file not found: {gradle_path}")

          s = java_path.read_text(encoding="utf-8")

          # Remove the v2.1 immersive-navigation call that happens before the
          # first screen is attached. This is the main startup regression.
          startup_pattern = re.compile(
              r'(getWindow\(\)\.setNavigationBarColor\(background\);\s*)'
              r'enableImmersiveNavigation\(\);\s*'
              r'(prefs\s*=\s*getSharedPreferences\("project_mister",\s*MODE_PRIVATE\);)',
              re.MULTILINE
          )
          s, count = startup_pattern.subn(r'\1\2', s, count=1)
          if count != 1:
              raise SystemExit(
                  f"Expected to remove one early immersive-navigation call, removed {count}."
              )

          # Replace the Android-R WindowInsets implementation with a safer
          # decor-view implementation wrapped in a catch-all.
          immersive_pattern = re.compile(
              r'(?ms)^(\s*)private void enableImmersiveNavigation\(\)\s*\{.*?'
              r'^\1\}\s*\n\s*@Override\s*\n\s*public void onWindowFocusChanged'
          )

          def immersive_replacement(match):
              ind = match.group(1)
              return f'''{ind}private void enableImmersiveNavigation() {{
{ind}    try {{
{ind}        getWindow().getDecorView().setSystemUiVisibility(
{ind}                View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
{ind}                        | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
{ind}                        | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
{ind}                        | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
{ind}        );
{ind}    }} catch (Throwable error) {{
{ind}        android.util.Log.w("BOSSXI", "Navigation-bar hiding skipped", error);
{ind}    }}
{ind}}}

{ind}@Override
{ind}public void onWindowFocusChanged'''

          s, count = immersive_pattern.subn(immersive_replacement, s, count=1)
          if count != 1:
              raise SystemExit(
                  f"Expected to replace one immersive-navigation method, replaced {count}."
              )

          # Protect the full startup path so any future startup exception is
          # shown inside BOSS XI instead of Android's generic crash dialog.
          oncreate_pattern = re.compile(
              r'(?ms)^(\s*)@Override\s*\n'
              r'\1protected void onCreate\(Bundle savedInstanceState\)\s*\{\s*'
              r'super\.onCreate\(savedInstanceState\);\s*'
              r'getWindow\(\)\.setStatusBarColor\(background\);\s*'
              r'getWindow\(\)\.setNavigationBarColor\(background\);\s*'
              r'prefs\s*=\s*getSharedPreferences\("project_mister",\s*MODE_PRIVATE\);\s*'
              r'loadEditorData\(\);\s*'
              r'generatePlayers\(\);\s*'
              r'showMainMenu\(\);\s*'
              r'^\1\}'
          )

          def oncreate_replacement(match):
              ind = match.group(1)
              return f'''{ind}@Override
{ind}protected void onCreate(Bundle savedInstanceState) {{
{ind}    super.onCreate(savedInstanceState);
{ind}    try {{
{ind}        getWindow().setStatusBarColor(background);
{ind}        getWindow().setNavigationBarColor(background);
{ind}        prefs = getSharedPreferences("project_mister", MODE_PRIVATE);
{ind}        loadEditorData();
{ind}        generatePlayers();
{ind}        showMainMenu();
{ind}    }} catch (Throwable error) {{
{ind}        android.util.Log.e("BOSSXI", "Startup failure", error);
{ind}        showStartupRecovery(error);
{ind}    }}
{ind}}}'''

          s, count = oncreate_pattern.subn(oncreate_replacement, s, count=1)
          if count != 1:
              raise SystemExit(f"Expected to protect one onCreate method, protected {count}.")

          # Add an in-app startup recovery screen.
          marker = re.search(
              r'(?m)^(\s*)private void enableImmersiveNavigation\(\)',
              s
          )
          if not marker:
              raise SystemExit("Could not find immersive navigation insertion point.")

          ind = marker.group(1)
          recovery = f'''{ind}private void showStartupRecovery(Throwable error) {{
{ind}    try {{
{ind}        LinearLayout page = new LinearLayout(this);
{ind}        page.setOrientation(LinearLayout.VERTICAL);
{ind}        page.setPadding(dp(24), dp(36), dp(24), dp(24));
{ind}        page.setBackgroundColor(background);

{ind}        TextView title = new TextView(this);
{ind}        title.setText("BOSS XI startup recovery");
{ind}        title.setTextColor(Color.WHITE);
{ind}        title.setTextSize(24);
{ind}        title.setTypeface(Typeface.DEFAULT_BOLD);
{ind}        page.addView(title);

{ind}        TextView message = new TextView(this);
{ind}        String reason = error == null
{ind}                ? "Unknown startup error"
{ind}                : error.getClass().getSimpleName()
{ind}                        + (error.getMessage() == null ? "" : ": " + error.getMessage());
{ind}        message.setText("\\nThe game prevented a startup crash.\\n\\n"
{ind}                + reason
{ind}                + "\\n\\nTake a screenshot of this screen and send it to me.");
{ind}        message.setTextColor(Color.WHITE);
{ind}        message.setTextSize(16);
{ind}        message.setPadding(0, dp(12), 0, dp(24));
{ind}        page.addView(message);

{ind}        Button reset = new Button(this);
{ind}        reset.setText("Clear local BOSS XI data and retry");
{ind}        reset.setOnClickListener(v -> {{
{ind}            try {{
{ind}                if (prefs != null) prefs.edit().clear().commit();
{ind}            }} catch (Throwable ignored) {{
{ind}            }}
{ind}            recreate();
{ind}        }});
{ind}        page.addView(reset);

{ind}        setContentView(page);
{ind}    }} catch (Throwable fallback) {{
{ind}        android.util.Log.e("BOSSXI", "Recovery screen failure", fallback);
{ind}        TextView emergency = new TextView(this);
{ind}        emergency.setText("BOSS XI startup error: "
{ind}                + (error == null ? "unknown" : error.getClass().getSimpleName()));
{ind}        emergency.setTextColor(Color.WHITE);
{ind}        emergency.setBackgroundColor(Color.BLACK);
{ind}        emergency.setPadding(24, 24, 24, 24);
{ind}        setContentView(emergency);
{ind}    }}
{ind}}}

'''
          insert_at = marker.start()
          s = s[:insert_at] + recovery + s[insert_at:]

          # Protect the first portrait-orientation request as well.
          s, count = re.subn(
              r'(?m)^(\s*)setRequestedOrientation\(ActivityInfo\.SCREEN_ORIENTATION_PORTRAIT\);\s*$',
              r'''\1try {
\1    setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_PORTRAIT);
\1} catch (Throwable error) {
\1    android.util.Log.w("BOSSXI", "Portrait request ignored", error);
\1}''',
              s,
              count=1
          )
          if count != 1:
              raise SystemExit(f"Expected to protect one portrait request, protected {count}.")

          s = s.replace(
              "Three career saves • BOSS XI v1.7 • Live Engine Fix",
              "Three career saves • BOSS XI v2.1.1 • Startup Fix",
              1
          )

          java_path.write_text(s, encoding="utf-8")

          g = gradle_path.read_text(encoding="utf-8")
          if "versionCode 21" not in g or 'versionName "2.1"' not in g:
              raise SystemExit("Could not locate v2.1 version fields in app/build.gradle.")
          g = g.replace("versionCode 21", "versionCode 22", 1)
          g = g.replace('versionName "2.1"', 'versionName "2.1.1"', 1)
          gradle_path.write_text(g, encoding="utf-8")

          print("Applied BOSS XI v2.1.1 startup hotfix.")
          PY

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Android startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.projectmister.game
            adb shell am start -W -n com.projectmister.game/.MainActivity
            sleep 6

            PID=$(adb shell pidof com.projectmister.game | tr -d '\r')
            if [ -z "$PID" ]; then
              echo "BOSS XI process died during startup."
              adb logcat -d | grep -E "FATAL EXCEPTION|AndroidRuntime|BOSSXI" | tail -n 200 || true
              exit 1
            fi

            if adb logcat -d | grep -A 40 "FATAL EXCEPTION" | grep -q "com.projectmister.game"; then
              echo "BOSS XI logged a fatal exception during startup."
              adb logcat -d | grep -E "FATAL EXCEPTION|AndroidRuntime|BOSSXI" | tail -n 200 || true
              exit 1
            fi

            echo "BOSS XI stayed alive after launch. PID=$PID"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BOSS-XI-v2.1.1-startup-fix-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
