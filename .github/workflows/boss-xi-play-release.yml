name: BOSS XI Play release checks
on:
  push:
    branches: [work/boss-xi-v2.3.18-play]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: boss-play-${{ github.ref }}-${{ contains(github.event.head_commit.message, '[extra-device-check]') && 'extra' || 'full' }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(contains(github.event.head_commit.message, '[extra-device-check]') && '{"include":[{"api":"26","suite":"minimum"},{"api":"37.0","suite":"latest"}]}' || '{"include":[{"api":"26","suite":"minimum"},{"api":"35","suite":"match"},{"api":"36","suite":"deep"},{"api":"37.0","suite":"latest"}]}') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0'
      - name: Game engine and signed receipt checks
        if: matrix.suite == 'deep'
        run: |
          mkdir -p qa-output
          bash tools/test-core.sh | tee qa-output/core.txt
      - name: Build the actual upload candidate and preserved test upgrade
        run: |
          gradle :app:assembleDebug :app:bundleRelease --no-daemon
          bash tools/build-test-sdk.sh
          git worktree add --detach /tmp/boss-baseline 1ac2bb0ced13deefbe995dbcf0d59cf9d67a7d16
          (cd /tmp/boss-baseline && gradle :app:assembleDebug --no-daemon)
      - name: Fetch pinned bundletool
        run: |
          mkdir -p app/build/toolchain
          curl --fail --location --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o app/build/toolchain/bundletool.jar
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  app/build/toolchain/bundletool.jar' | sha256sum --check
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check gameplay and release splits on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_6
          ram-size: ${{ matrix.suite == 'latest' && '4096M' || '2048M' }}
          disable-animations: true
          script: bash tools/qa-play.sh ${{ matrix.suite }}
      - name: QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BOSS-XI-2.3.18-QA-api${{ matrix.api }}
          path: qa-output/
          retention-days: 30
      - name: Tested bundles
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BOSS-XI-2.3.18-builds-api${{ matrix.api }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
