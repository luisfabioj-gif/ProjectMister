name: BOSS XI 2.3.14 feedback verification
on:
  push:
    branches: [work/boss-xi-v2.3.14-fixes]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: boss-feedback-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0'
      - name: Core regression tests
        run: bash tools/test-core.sh
      - name: Build update and independent instrumentation
        run: |
          gradle :app:assembleDebug --no-daemon
          bash tools/build-test-sdk.sh
          git worktree add --detach /tmp/boss-baseline 78bbfa83b3f6c60d11d16c6ee6075ea7365a721b
          cd /tmp/boss-baseline
          gradle :app:assembleDebug --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify requested fixes and preserved gameplay
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/qa-feedback.sh
      - name: Preserve Android screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BOSS-XI-2.3.14-QA-api${{ matrix.api }}
          path: qa-output/
          retention-days: 30
      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: BOSS-XI-2.3.14-tested-api${{ matrix.api }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
